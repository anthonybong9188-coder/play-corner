<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peekaboo Pets · Play Corner</title>
<meta name="theme-color" content="#F4F8FC">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .screen { height: 100dvh; min-height: 0; }
  .goal {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border-radius: 20px; padding: 10px 16px;
  }
  .goal-text { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; }
  .count { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 800; font-size: 26px; }
  .round { font-size: 14px; font-weight: 800; color: var(--ink-2); }

  .garden {
    flex: 1; min-height: 0; position: relative; border-radius: 24px; overflow: hidden;
    background: #8FD694;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 4px; padding: 10px 8px 6px;
  }
  .garden::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 18%; background: #CDEBFB; }
  .flower { position: absolute; pointer-events: none; }

  .hole {
    appearance: none; -webkit-appearance: none; border: 0; padding: 0; margin: 0; background: transparent;
    position: relative; cursor: pointer; touch-action: manipulation; min-height: 0;
  }
  .hole .pit { position: absolute; left: 8%; right: 8%; bottom: 9%; height: 28%; border-radius: 50%; background: #3E2716; box-shadow: inset 0 8px 0 #24160C; }
  .hole .well { position: absolute; left: 6%; right: 6%; top: 0; bottom: 20%; overflow: hidden; }
  .hole .pet {
    position: absolute; left: 50%; bottom: 0; width: min(100%, 120px); aspect-ratio: 1;
    transform: translate(-50%, 110%); transition: transform .22s cubic-bezier(.3,.7,.3,1.25);
  }
  .hole .pet svg { width: 100%; height: 100%; display: block; }
  .hole.up .pet { transform: translate(-50%, 6%); }
  .hole.up .pet .wig { animation: wig .9s ease-in-out infinite; transform-origin: 50% 90%; }
  .hole.found .pet { transform: translate(-50%, 2%) scale(1.06); }
  @keyframes wig { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .hole .lip { position: absolute; left: 3%; right: 3%; bottom: 3%; height: 19%; border-radius: 0 0 50% 50% / 0 0 100% 100%; background: #9C6B43; box-shadow: inset 0 -5px 0 #7E5333; }

  .stars { position: absolute; left: 50%; top: 40%; width: 0; height: 0; pointer-events: none; z-index: 4; }
  .stars i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; animation: star .7s ease-out forwards; }
  .stars i svg { width: 100%; height: 100%; display: block; }
  @keyframes star { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(90deg); opacity: 0; } }

  .cheer {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    background: var(--ok); color: #FFFFFF; border-radius: 28px; box-shadow: 0 6px 0 #22804F;
    padding: 8px 26px; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.2;
    white-space: nowrap; display: none; z-index: 6; pointer-events: none;
  }
  .cheer.show { display: block; animation: cheerpop .4s cubic-bezier(.3,.7,.3,1.4); }
  @keyframes cheerpop { from { transform: translate(-50%, -50%) scale(.6); } to { transform: translate(-50%, -50%) scale(1); } }
</style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <a class="round-btn" href="../" aria-label="Back to games">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1>Peekaboo Pets</h1>
    <button class="round-btn" type="button" id="restart" aria-label="Start over">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>

  <div class="goal">
    <div>
      <div class="goal-text">Find 10 friends!</div>
      <div class="round" id="round">Round 1</div>
    </div>
    <div class="count" aria-live="polite">
      <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="#F5B800"/></svg>
      <span id="count">0</span><span style="color:var(--ink-3);font-size:20px">/ 10</span>
    </div>
  </div>

  <div class="garden" id="garden">
    <svg class="flower" style="left:4%;top:3%" width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><g fill="#FFFFFF"><circle cx="20" cy="9" r="7"/><circle cx="31" cy="17" r="7"/><circle cx="27" cy="30" r="7"/><circle cx="13" cy="30" r="7"/><circle cx="9" cy="17" r="7"/></g><circle cx="20" cy="20" r="6" fill="#F5B800"/></svg>
    <svg class="flower" style="right:6%;top:5%" width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><g fill="#F7B6C2"><circle cx="20" cy="9" r="7"/><circle cx="31" cy="17" r="7"/><circle cx="27" cy="30" r="7"/><circle cx="13" cy="30" r="7"/><circle cx="9" cy="17" r="7"/></g><circle cx="20" cy="20" r="6" fill="#F5B800"/></svg>
    <div class="cheer" id="cheer">You found them all!</div>
  </div>

  <p class="hint">Tap the pets when they peek out!</p>
</main>

<script src="../assets/animals.js"></script>
<script src="../assets/sfx.js"></script>
<script>
(function () {
  var NEED = 10;
  var NAMES = { bunny: 'Bunny', cat: 'Kitty', dog: 'Doggy', monkey: 'Monkey', frog: 'Froggy', chick: 'Chick' };
  var garden = document.getElementById('garden'), countEl = document.getElementById('count'), roundEl = document.getElementById('round'), cheer = document.getElementById('cheer');

  var holes = [];
  for (var i = 0; i < 9; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'hole';
    b.setAttribute('aria-label', 'Hole ' + (i + 1));
    b.innerHTML = '<div class="pit"></div><div class="well"><div class="pet"></div></div><div class="lip"></div>';
    garden.appendChild(b);
    var h = { el: b, pet: b.querySelector('.pet'), up: false, found: false, kind: null, downAt: 0, timer: 0 };
    b.addEventListener('pointerdown', tap.bind(null, h));
    holes.push(h);
  }

  var round, found, nextAt, lastKind, paused = false;

  function speeds() {
    return {
      stay: Math.max(800, 1900 * Math.pow(0.88, round - 1)),   // how long a pet stays up
      gap: Math.max(450, 1100 * Math.pow(0.9, round - 1)),     // time between pets
      many: round >= 3 ? 2 : 1                                 // how many can peek at once
    };
  }

  function startOver() {
    holes.forEach(hide);
    round = 1; found = 0; paused = false;
    cheer.classList.remove('show');
    update();
    nextAt = performance.now() + 700;
  }

  function update() {
    countEl.textContent = found;
    roundEl.textContent = 'Round ' + round;
  }

  function show(h) {
    var kinds = PC.ANIMALS.filter(function (k) { return k !== lastKind; });
    h.kind = lastKind = kinds[Math.floor(Math.random() * kinds.length)];
    h.pet.innerHTML = '<div class="wig">' + PC.animal(h.kind, 'open') + '</div>';
    h.up = true; h.found = false;
    h.el.classList.add('up');
    h.el.setAttribute('aria-label', NAMES[h.kind] + ' is peeking!');
    h.downAt = performance.now() + speeds().stay;
    PC.sfx.pop();
  }

  function hide(h) {
    h.up = false;
    h.el.classList.remove('up', 'found');
    h.el.setAttribute('aria-label', 'Hole');
  }

  function stars(h) {
    var s = document.createElement('div');
    s.className = 'stars';
    var html = '';
    for (var i = 0; i < 8; i++) {
      var a = i / 8 * Math.PI * 2, r = 46 + Math.random() * 22;
      html += '<i style="--dx:' + Math.round(Math.cos(a) * r) + 'px;--dy:' + Math.round(Math.sin(a) * r) + 'px"><svg viewBox="0 0 100 100"><polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="' + ['#F5B800', '#E8579B', '#2F6FED', '#2FA86B'][i % 4] + '"/></svg></i>';
    }
    s.innerHTML = html;
    h.el.appendChild(s);
    setTimeout(function () { s.remove(); }, 800);
  }

  function tap(h, e) {
    e.preventDefault();
    PC.sfx.unlock();
    if (!h.up || h.found || paused) return;
    h.found = true;
    h.el.classList.add('found');
    h.pet.innerHTML = '<div>' + PC.animal(h.kind, 'happy') + '</div>';
    stars(h);
    PC.sfx.giggle();
    PC.sfx.say(NAMES[h.kind] + '!');
    found++;
    update();
    h.downAt = performance.now() + 650;
    if (found >= NEED) roundDone();
  }

  function roundDone() {
    paused = true;
    setTimeout(function () {
      holes.forEach(hide);
      cheer.textContent = ['You found them all!', 'Peekaboo! Great job!', 'Super finding!'][(round - 1) % 3];
      cheer.classList.add('show');
      PC.sfx.tada();
      PC.sfx.say(cheer.textContent);
    }, 700);
    setTimeout(function () {
      cheer.classList.remove('show');
      round++; found = 0; paused = false;
      update();
      nextAt = performance.now() + 600;
    }, 3000);
  }

  function frame(now) {
    for (var i = 0; i < holes.length; i++) {
      var h = holes[i];
      if (h.up && now >= h.downAt) hide(h);
    }
    if (!paused && now >= nextAt) {
      var sp = speeds();
      var upCount = holes.filter(function (x) { return x.up; }).length;
      if (upCount < sp.many) {
        var free = holes.filter(function (x) { return !x.up; });
        show(free[Math.floor(Math.random() * free.length)]);
      }
      nextAt = now + sp.gap + Math.random() * 400;
    }
    requestAnimationFrame(frame);
  }

  document.getElementById('restart').addEventListener('click', startOver);
  startOver();
  requestAnimationFrame(frame);
})();
</script>
<script src="../assets/sw-register.js"></script>
</body>
</html>
