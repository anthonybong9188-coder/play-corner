<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跟我读 Read With Me · Play Corner</title>
<meta name="theme-color" content="#F4F8FC">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .screen { height: 100dvh; min-height: 0; gap: 10px; }
  .card {
    flex: 1; min-height: 0; border-radius: 24px; background: #fff; box-shadow: 0 4px 0 var(--card-shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 14px 10px; position: relative; overflow: hidden;
  }
  .progress { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
  .progress i { width: 12px; height: 12px; border-radius: 50%; background: #E3EAF3; }
  .progress i.on { background: #FFD23F; box-shadow: 0 0 0 2px #F5B800 inset; }
  .progress i.cur { outline: 3px solid var(--ink); outline-offset: 2px; }
  .pic { width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .pic svg { width: 100%; height: 100%; }
  .pic.two > div { width: 96px; height: 96px; }
  .phase {
    display: flex; align-items: center; gap: 8px; border-radius: 20px; padding: 6px 14px; min-height: 38px;
    font-weight: 800; font-size: 17px; background: #EEF3F9; color: var(--ink-2); transition: background .2s, color .2s;
  }
  .phase svg { width: 22px; height: 22px; flex-shrink: 0; }
  .phase.listen { background: #FFF1C2; color: #7A5600; }
  .phase.turn { background: #DDF5E7; color: #1D6B43; }
  .phase.done { background: var(--ok); color: #fff; }
  .phase .zh { font-size: 18px; }

  /* the sentence: one box per character, words kept together */
  .sentence { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; row-gap: 10px; column-gap: 10px; max-width: 100%; }
  .word { display: flex; border-radius: 16px; cursor: pointer; padding: 2px; transition: background .2s, transform .2s, box-shadow .2s; -webkit-tap-highlight-color: transparent; }
  .ch { display: flex; flex-direction: column; align-items: center; width: 50px; }
  .ch .py { font-size: 15px; line-height: 1.2; min-height: 18px; color: var(--ink-2); white-space: nowrap; }
  .ch .hz { font-size: 44px; line-height: 1.15; font-weight: 700; color: var(--ink); }
  .nopy .ch .py { visibility: hidden; }
  .punct .ch { width: 22px; }
  .punct { cursor: default; }
  .word.now { background: #FFD23F; transform: scale(1.12); box-shadow: 0 4px 0 #E0A800; }
  .word.heard { background: #FFF1C2; }
  .word.now.you { background: #5FD394; box-shadow: 0 4px 0 #2FA86B; }
  .word.read { background: #DDF5E7; }
  .en { font-size: 15px; font-weight: 700; color: var(--ink-2); text-align: center; min-height: 20px; }

  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; flex-shrink: 0; }
  .ctl {
    appearance: none; border: 0; cursor: pointer; border-radius: 22px; min-height: 76px; padding: 8px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-weight: 800; font-size: 13px; color: #fff;
  }
  .ctl .zh { font-size: 20px; line-height: 1.1; }
  .ctl svg { width: 26px; height: 26px; }
  .ctl.listen { background: #F5A623; box-shadow: 0 5px 0 #C47F0E; }
  .ctl.me { background: var(--ok); box-shadow: 0 5px 0 #22804F; }
  .ctl.next { background: #2F6FED; box-shadow: 0 5px 0 #1F4FB8; }
  .ctl:active { transform: translateY(3px); box-shadow: none; }
  .ctl:disabled { opacity: .45; }
  .ctl.pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .pytoggle { font-size: 13px; font-weight: 800; }
  .start h2 { margin: 0; font-size: 34px; line-height: 1.2; }
  .start p { margin: 0; font-size: 17px; font-weight: 700; color: var(--ink-2); max-width: 310px; }
  .start ol { margin: 0; padding: 0 0 0 22px; text-align: left; font-weight: 700; color: var(--ink-2); font-size: 16px; display: grid; gap: 6px; max-width: 300px; }
  .chip .done-tick { color: var(--ok); font-weight: 900; }
</style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <a class="round-btn" href="../" aria-label="Back to games">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1><span class="zh">跟我读</span></h1>
    <button class="round-btn pytoggle" type="button" id="pyBtn" aria-label="Show or hide pinyin" aria-pressed="true">pīn<br>yīn</button>
  </div>
  <p class="voice-note" id="voiceNote"></p>

  <div class="chips" id="lessons"></div>

  <section class="card">
    <div class="progress" id="progress"></div>
    <div class="pic" id="pic"></div>
    <div class="phase" id="phase"></div>
    <div class="sentence zh" id="sentence"></div>
    <div class="en" id="en"></div>
  </section>

  <div class="controls">
    <button class="ctl listen" type="button" id="listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg><span class="zh">听一听</span>Listen</button>
    <button class="ctl me" type="button" id="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5" fill="#fff"/><path d="M9.5 10.5q2.5 2 5 0" stroke="#2FA86B" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M4 22c0-5 4-7 8-7s8 2 8 7z" fill="#fff"/></svg><span class="zh">我来读</span>My turn</button>
    <button class="ctl next" type="button" id="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="zh">下一句</span>Next</button>
  </div>
</main>

<div class="start" id="startScreen">
  <h2 class="zh">跟我读</h2>
  <p>Read With Me</p>
  <ol>
    <li>Listen: each word lights up as it is read.</li>
    <li>Your turn: the light moves again. Read each word out loud as it lights up.</li>
    <li>Tap any word to hear it on its own.</li>
  </ol>
  <button class="big-btn" type="button" id="go">开始 Start</button>
</div>

<script src="../assets/sfx.js"></script>
<script src="../assets/animals.js"></script>
<script src="../assets/zh.js"></script>
<script>
(function () {
  // Sentences at a 4-year-old (K1) level. Words are split with " / ", each "汉字:pīn yīn".
  // Pinyin follows the textbook habit: neutral tones unmarked, 一 and 不 shown with their changed tone.
  var V = PC.zhVocab || {}, find = function (set, id) { var s = V[set]; var it = s && s.items.filter(function (x) { return x.id === id; })[0]; return it ? it.pic() : ''; };
  var W = function (set, id) { var g = (PC.zhWriteGroups || []).map(function (g) { return g.items; }).reduce(function (a, b) { return a.concat(b); }, []).filter(function (x) { return x.id === id; })[0]; return g ? g.pic() : ''; };
  var A = function (k, m) { return PC.animal(k, m || 'happy'); };
  var STAR = '<svg viewBox="0 0 100 100"><polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="#FFD23F" stroke="#F5A623" stroke-width="4" stroke-linejoin="round"/><circle cx="20" cy="18" r="4" fill="#FFD23F"/><circle cx="86" cy="80" r="3" fill="#FFD23F"/></svg>';
  var TWO = function (a, b) { return { two: true, html: '<div>' + a + '</div><div>' + b + '</div>' }; };
  var LESSONS = [
    { hz: '你好', en: 'Hello', s: [
      ['你好:nǐ hǎo / !', 'Hello!', function () { return A('chick'); }],
      ['老师:lǎo shī / 好:hǎo / !', 'Hello, teacher!', function () { return A('cat'); }],
      ['早上:zǎo shang / 好:hǎo / !', 'Good morning!', function () { return W('', 'ri'); }],
      ['谢谢:xiè xie / 你:nǐ / !', 'Thank you!', function () { return A('bunny'); }],
      ['不客气:bú kè qi / 。', "You're welcome.", function () { return A('dog'); }],
      ['再见:zài jiàn / !', 'Goodbye!', function () { return A('monkey'); }]
    ]},
    { hz: '我的家', en: 'My family', s: [
      ['我:wǒ / 爱:ài / 妈妈:mā ma / 。', 'I love Mummy.', function () { return TWO(A('bunny'), A('bunny', 'open')); }],
      ['我:wǒ / 爱:ài / 爸爸:bà ba / 。', 'I love Daddy.', function () { return TWO(A('dog'), A('dog', 'open')); }],
      ['妈妈:mā ma / 爱:ài / 我:wǒ / 。', 'Mummy loves me.', function () { return TWO(A('cat'), A('cat', 'open')); }],
      ['我:wǒ / 有:yǒu / 一个:yí gè / 家:jiā / 。', 'I have a family.', function () { return W('', 'ren'); }],
      ['我们:wǒ men / 是:shì / 一家人:yì jiā rén / 。', 'We are one family.', function () { return TWO(A('chick'), A('chick', 'open')); }]
    ]},
    { hz: '小动物', en: 'Animals', s: [
      ['小猫:xiǎo māo / 喵喵:miāo miāo / 叫:jiào / 。', 'The kitten says miaow.', function () { return A('cat', 'open'); }],
      ['小狗:xiǎo gǒu / 汪汪:wāng wāng / 叫:jiào / 。', 'The puppy says woof.', function () { return A('dog', 'open'); }],
      ['小鸡:xiǎo jī / 叽叽:jī jī / 叫:jiào / 。', 'The chick says cheep.', function () { return A('chick', 'open'); }],
      ['小鸟:xiǎo niǎo / 飞飞飞:fēi fēi fēi / 。', 'The little bird flies.', function () { return W('', 'niao'); }],
      ['小鱼:xiǎo yú / 游游游:yóu yóu yóu / 。', 'The little fish swims.', function () { return W('', 'yu-fish'); }],
      ['小兔:xiǎo tù / 跳跳跳:tiào tiào tiào / 。', 'The bunny hops.', function () { return A('bunny'); }]
    ]},
    { hz: '水果', en: 'Fruit', s: [
      ['苹果:píng guǒ / 红红的:hóng hóng de / 。', 'The apple is red.', function () { return find('fruits', 'apple'); }],
      ['香蕉:xiāng jiāo / 黄黄的:huáng huáng de / 。', 'The banana is yellow.', function () { return find('fruits', 'banana'); }],
      ['葡萄:pú tao / 紫紫的:zǐ zǐ de / 。', 'The grapes are purple.', function () { return find('fruits', 'grapes'); }],
      ['西瓜:xī guā / 大:dà / 又:yòu / 圆:yuán / 。', 'The watermelon is big and round.', function () { return find('fruits', 'watermelon'); }],
      ['我:wǒ / 爱:ài / 吃:chī / 水果:shuǐ guǒ / 。', 'I love eating fruit.', function () { return find('fruits', 'strawberry'); }]
    ]},
    { hz: '我的身体', en: 'My body', s: [
      ['我:wǒ / 有:yǒu / 两只:liǎng zhī / 眼睛:yǎn jing / 。', 'I have two eyes.', function () { return find('body', 'eye'); }],
      ['我:wǒ / 有:yǒu / 一张:yì zhāng / 嘴巴:zuǐ ba / 。', 'I have one mouth.', function () { return find('body', 'mouth'); }],
      ['我:wǒ / 有:yǒu / 两只:liǎng zhī / 小手:xiǎo shǒu / 。', 'I have two little hands.', function () { return find('body', 'hand'); }],
      ['拍拍:pāi pāi / 手:shǒu / 。', 'Clap your hands.', function () { return find('body', 'hand'); }],
      ['跺跺:duò duò / 脚:jiǎo / 。', 'Stamp your feet.', function () { return find('body', 'foot'); }]
    ]},
    { hz: '天空', en: 'The sky', s: [
      ['太阳:tài yáng / 出来:chū lái / 了:le / 。', 'The sun has come out.', function () { return W('', 'ri'); }],
      ['下雨:xià yǔ / 了:le / 。', "It's raining.", function () { return W('', 'yu'); }],
      ['月亮:yuè liang / 弯弯的:wān wān de / 。', 'The moon is curved.', function () { return W('', 'yue'); }],
      ['星星:xīng xing / 亮晶晶:liàng jīng jīng / 。', 'The stars are twinkling.', function () { return STAR; }],
      ['天:tiān / 黑:hēi / 了:le / ， / 我:wǒ / 要:yào / 睡觉:shuì jiào / 了:le / 。', "It's dark. Time for bed.", function () { return W('', 'yue'); }]
    ]}
  ];
  var PUNCT = /^[。！？，!?,]$/;
  function parse(line) {
    return line.split(' / ').map(function (w) {
      if (PUNCT.test(w)) return { hz: w === '!' ? '！' : w, py: [], punct: true };
      var p = w.split(':'), chars = Array.from(p[0]), py = p[1].split(' ');
      if (py.length !== chars.length) throw new Error('pinyin count ' + w);
      return { hz: p[0], py: py, punct: false };
    });
  }

  var $ = function (id) { return document.getElementById(id); };
  var say = function (t, o) { PC.zh.say(t, o); };
  var play = function (n) { try { PC.sfx && PC.sfx[n] && PC.sfx[n](); } catch (e) {} };
  var lesson = 0, idx = 0, words = [], run = 0, durs = [], showPy = true, done = {};
  try { done = JSON.parse(localStorage.getItem('pc-zhread-done') || '{}') || {}; } catch (e) {}
  try { showPy = localStorage.getItem('pc-zhread-py') !== '0'; } catch (e) {}
  var key = function (l, i) { return l + '-' + i; };
  var save = function () { try { localStorage.setItem('pc-zhread-done', JSON.stringify(done)); } catch (e) {} };

  var ICON = {
    ear: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M10 9a2 2 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    mouth: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><ellipse cx="12" cy="15" rx="3.5" ry="2.5" fill="currentColor"/><circle cx="9" cy="9.5" r="1.3" fill="currentColor"/><circle cx="15" cy="9.5" r="1.3" fill="currentColor"/></svg>',
    star: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="#FFD23F"/></svg>',
    tap: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21v-9a2 2 0 0 1 4 0v4l4 1c1.5.4 2.2 1.8 1.8 3.3L18 21z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M6 8a5 5 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  function setPhase(kind, zh, en) {
    var p = $('phase'); p.className = 'phase ' + (kind || '');
    p.innerHTML = (ICON[kind === 'listen' ? 'ear' : kind === 'turn' ? 'mouth' : kind === 'done' ? 'star' : 'tap']) + '<span class="zh">' + zh + '</span><span>' + en + '</span>';
  }

  // ---- Lessons row ----
  function renderLessons() {
    $('lessons').innerHTML = LESSONS.map(function (L, i) {
      var n = L.s.filter(function (_, j) { return done[key(i, j)]; }).length;
      return '<button class="chip' + (i === lesson ? ' on' : '') + '" type="button" data-l="' + i + '"><span class="zh">' + L.hz + '</span><span class="py">' + (n === L.s.length ? '<span class="done-tick">✓</span>' : n + '/' + L.s.length) + '</span></button>';
    }).join('');
  }
  $('lessons').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip'); if (!b) return;
    lesson = +b.dataset.l; idx = 0; renderLessons(); show(true);
  });

  // ---- Showing a sentence ----
  function show(autoplay) {
    stop();
    var S = LESSONS[lesson].s[idx];
    words = parse(S[0]); durs = [];
    var pic = S[2](), el = $('pic');
    if (pic && pic.two) { el.className = 'pic two'; el.innerHTML = pic.html; } else { el.className = 'pic'; el.innerHTML = pic; }
    $('sentence').innerHTML = words.map(function (w, i) {
      var chars = Array.from(w.hz);
      return '<div class="word' + (w.punct ? ' punct' : '') + '" data-w="' + i + '">' + chars.map(function (c, k) {
        return '<div class="ch"><span class="py">' + (w.py[k] || '') + '</span><span class="hz">' + c + '</span></div>';
      }).join('') + '</div>';
    }).join('');
    $('en').textContent = S[1];
    $('progress').innerHTML = LESSONS[lesson].s.map(function (_, j) { return '<i class="' + (done[key(lesson, j)] ? 'on' : '') + (j === idx ? ' cur' : '') + '"></i>'; }).join('');
    $('me').classList.remove('pulse'); $('next').classList.remove('pulse');
    setPhase('', '点一点', 'Tap a word to hear it');
    var my = run;
    if (autoplay) setTimeout(function () { if (my === run) listen(); }, 300);
  }
  var spoken = function () { return words.map(function (w, i) { return i; }).filter(function (i) { return !words[i].punct; }); };
  function wordEl(i) { return $('sentence').querySelector('[data-w="' + i + '"]'); }
  function clearMarks() { [].forEach.call($('sentence').querySelectorAll('.word'), function (e) { e.classList.remove('now', 'heard', 'you', 'read'); }); }
  function stop() { run++; try { speechSynthesis.cancel(); } catch (e) {} }

  // Teacher reads: one word at a time, each word lights up while it is spoken.
  function listen() {
    stop(); var my = run, list = spoken(), n = 0;
    clearMarks(); setPhase('listen', '听老师读', 'Listen');
    $('me').classList.remove('pulse');
    (function nextWord() {
      if (my !== run) return;
      if (n > 0) { var prev = wordEl(list[n - 1]); prev.classList.remove('now'); prev.classList.add('heard'); }
      if (n >= list.length) {
        // reset the light and hand over to the child
        setTimeout(function () { if (my !== run) return; clearMarks(); yourTurn(true); }, 700);
        return;
      }
      var i = list[n], w = words[i], t0 = Date.now(), fired = false;
      wordEl(i).classList.add('now');
      var go = function () { if (fired || my !== run) return; fired = true; durs[i] = Date.now() - t0; n++; setTimeout(nextWord, 160); };
      say(w.hz, { rate: 0.7, onend: go });
      // in case this phone never reports the end of speech
      setTimeout(go, 900 + 520 * Array.from(w.hz).length);
    })();
  }

  // Child's turn: the highlight moves again with no voice, a little slower.
  function yourTurn(handover) {
    stop(); var my = run, list = spoken(), n = 0;
    clearMarks(); setPhase('turn', '轮到你读', 'Your turn: read out loud');
    if (handover) say('轮到你了！');
    setTimeout(function step() {
      if (my !== run) return;
      if (n > 0) { var prev = wordEl(list[n - 1]); prev.classList.remove('now', 'you'); prev.classList.add('read'); }
      if (n >= list.length) { finish(); return; }
      var i = list[n], len = Array.from(words[i].hz).length;
      wordEl(i).classList.add('now', 'you');
      n++;
      setTimeout(step, Math.max(len * 750, (durs[i] || 0) * 1.4));
    }, handover ? 1400 : 500);
  }
  function finish() {
    var praise = ['读得真好！', '你真棒！', '好极了！'][Math.floor(Math.random() * 3)];
    setPhase('done', praise, 'Great reading!');
    say(praise); play('tada');
    done[key(lesson, idx)] = 1; save(); renderLessons();
    [].forEach.call($('progress').children, function (e, j) { if (j === idx) e.classList.add('on'); });
    $('next').classList.add('pulse');
  }

  // Tap a single word to hear it.
  $('sentence').addEventListener('click', function (ev) {
    var el = ev.target.closest('.word'); if (!el || el.classList.contains('punct')) return;
    stop(); clearMarks();
    var w = words[+el.dataset.w];
    el.classList.add('now'); say(w.hz, { rate: 0.7 });
    setPhase('', w.hz, w.py.join(' '));
    var my = run; setTimeout(function () { if (my === run) el.classList.remove('now'); }, 1200);
  });

  $('listen').addEventListener('click', listen);
  $('me').addEventListener('click', function () { yourTurn(false); });
  $('next').addEventListener('click', function () {
    idx++;
    if (idx >= LESSONS[lesson].s.length) { idx = 0; lesson = (lesson + 1) % LESSONS.length; renderLessons(); }
    show(true);
  });
  $('pyBtn').addEventListener('click', function () {
    showPy = !showPy; applyPy();
    try { localStorage.setItem('pc-zhread-py', showPy ? '1' : '0'); } catch (e) {}
  });
  function applyPy() { $('sentence').classList.toggle('nopy', !showPy); $('pyBtn').setAttribute('aria-pressed', String(showPy)); $('pyBtn').style.opacity = showPy ? 1 : .5; }

  $('go').addEventListener('click', function () {
    try { PC.sfx && PC.sfx.unlock(); } catch (e) {}
    $('startScreen').hidden = true; show(true);
  });
  // start at the first lesson not finished yet
  for (var l = 0; l < LESSONS.length; l++) { if (LESSONS[l].s.some(function (_, j) { return !done[key(l, j)]; })) { lesson = l; break; } }
  renderLessons(); applyPy(); show(false);
  PC.zh.voiceNotice($('voiceNote'));

  // for the automatic tests
  window.__zr = {
