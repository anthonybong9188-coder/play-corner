<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match the Cards · Play Corner</title>
<meta name="theme-color" content="#F4F8FC">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .screen { height: 100dvh; min-height: 0; }
  .board {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }
  .card {
    appearance: none; -webkit-appearance: none;
    border: 0; padding: 0; margin: 0; background: transparent;
    width: 100%; height: 100%;
    perspective: 900px; cursor: pointer; border-radius: 16px;
  }
  .inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.3,.7,.3,1.15);
  }
  .card.open .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 16px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .back { background: var(--sky); box-shadow: inset 0 0 0 5px #fff, 0 4px 0 var(--sky-shadow); }
  .back svg { width: 34%; height: auto; }
  .front { background: #fff; transform: rotateY(180deg); box-shadow: 0 4px 0 #CCD9E6; }
  .front svg { width: 64%; max-height: 70%; height: auto; }
  .card.matched .front { box-shadow: inset 0 0 0 4px var(--ok), 0 4px 0 #CCD9E6; }
  .card.matched .inner { animation: matchpop .45s ease-out; }
  .card.nope .front { animation: wiggle .35s ease-in-out .35s; }
  @keyframes matchpop { 0%,100% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.09); } }
  @keyframes wiggle { 0%,100% { transform: rotateY(180deg) translateX(0); } 25% { transform: rotateY(180deg) translateX(-5px); } 75% { transform: rotateY(180deg) translateX(5px); } }
</style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <a class="round-btn" href="../" aria-label="Back to games">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1>Match the Cards</h1>
    <button class="round-btn" type="button" id="restart" aria-label="New game">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>

  <div class="stat-row">
    <div class="stat"><span class="stat-label">Pairs</span><span class="stat-value" id="pairs">0 / 10</span></div>
    <div class="stat"><span class="stat-label">Tries</span><span class="stat-value" id="tries">0</span></div>
  </div>

  <div class="board" id="board" role="grid" aria-label="Cards"></div>

  <p class="hint">Tap two cards to find a match!</p>
</main>

<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title">
  <div class="overlay-card">
    <svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="#F5B800"/></svg>
    <h2 id="win-title">You found them all!</h2>
    <p id="win-text">You did it!</p>
    <button class="big-btn" type="button" id="again">Play again</button>
    <a class="text-link" href="../">Back to games</a>
  </div>
</div>

<script>
(function () {
  var PAIRS = [
    { shape: 'circle', color: '#E5484D', name: 'Red circle' },
    { shape: 'circle', color: '#2F6FED', name: 'Blue circle' },
    { shape: 'square', color: '#2FA86B', name: 'Green square' },
    { shape: 'square', color: '#F28C28', name: 'Orange square' },
    { shape: 'star',   color: '#F5B800', name: 'Yellow star' },
    { shape: 'star',   color: '#8B5CF6', name: 'Purple star' },
    { shape: 'hex',    color: '#14A3A3', name: 'Teal hexagon' },
    { shape: 'hex',    color: '#E8579B', name: 'Pink hexagon' },
    { shape: 'circle', color: '#8B5CF6', name: 'Purple circle' },
    { shape: 'hex',    color: '#2F6FED', name: 'Blue hexagon' }
  ];

  function shapeSvg(p) {
    var inner;
    if (p.shape === 'circle') inner = '<circle cx="50" cy="50" r="40" fill="' + p.color + '"/>';
    else if (p.shape === 'square') inner = '<rect x="12" y="12" width="76" height="76" rx="12" fill="' + p.color + '"/>';
    else if (p.shape === 'star') inner = '<polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="' + p.color + '"/>';
    else inner = '<polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="' + p.color + '"/>';
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' + inner + '</svg>';
  }
  var BACK = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width="10"/></svg>';

  var board = document.getElementById('board');
  var pairsEl = document.getElementById('pairs');
  var triesEl = document.getElementById('tries');
  var win = document.getElementById('win');
  var winText = document.getElementById('win-text');

  var deck, cards, open, matched, tries, lock, timer;

  function shuffle() {
    var d = [];
    for (var p = 0; p < PAIRS.length; p++) { d.push(p, p); }
    for (var i = d.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = d[i]; d[i] = d[j]; d[j] = t;
    }
    return d;
  }

  function newGame() {
    clearTimeout(timer);
    deck = shuffle();
    open = []; matched = 0; tries = 0; lock = false;
    board.innerHTML = '';
    cards = deck.map(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      b.setAttribute('aria-label', 'Card ' + (i + 1) + ', face down');
      b.innerHTML = '<div class="inner"><div class="face back">' + BACK + '</div><div class="face front">' + shapeSvg(PAIRS[p]) + '</div></div>';
      b.addEventListener('click', function () { pick(i); });
      board.appendChild(b);
      return b;
    });
    win.classList.remove('show');
    update();
  }

  function update() {
    pairsEl.textContent = matched + ' / ' + PAIRS.length;
    triesEl.textContent = tries;
  }

  function reveal(i, on) {
    var c = cards[i];
    c.classList.toggle('open', on);
    c.setAttribute('aria-label', on ? PAIRS[deck[i]].name : 'Card ' + (i + 1) + ', face down');
  }

  function pick(i) {
    var c = cards[i];
    if (lock || c.classList.contains('open')) return;
    reveal(i, true);
    open.push(i);
    if (open.length < 2) return;

    tries++;
    lock = true;
    update();
    var a = open[0], b = open[1];
    if (deck[a] === deck[b]) {
      timer = setTimeout(function () {
        cards[a].classList.add('matched');
        cards[b].classList.add('matched');
        cards[a].disabled = cards[b].disabled = true;
        matched++;
        open = []; lock = false;
        update();
        if (matched === PAIRS.length) {
          winText.textContent = 'You did it in ' + tries + ' tries.';
          setTimeout(function () { win.classList.add('show'); }, 500);
        }
      }, 450);
    } else {
      cards[a].classList.add('nope');
      cards[b].classList.add('nope');
      timer = setTimeout(function () {
        cards[a].classList.remove('nope');
        cards[b].classList.remove('nope');
        reveal(a, false); reveal(b, false);
        open = []; lock = false;
      }, 1100);
    }
  }

  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('again').addEventListener('click', newGame);
  newGame();
})();
</script>
<script src="../assets/sw-register.js"></script>
</body>
</html>
