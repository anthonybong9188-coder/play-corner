<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penalty Kick · Play Corner</title>
<meta name="theme-color" content="#F4F8FC">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .screen { height: 100dvh; min-height: 0; }
  .score {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border-radius: 20px; padding: 10px 16px;
  }
  .score-goals { display: flex; align-items: baseline; gap: 8px; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 30px; height: 30px; border-radius: 15px; border: 3px solid #CFDCEA; display: flex; align-items: center; justify-content: center; }
  .dot.goal { background: var(--ok); border-color: var(--ok); }
  .dot.miss { background: #8A97B1; border-color: #8A97B1; }
  .dot svg { display: none; }
  .dot.goal .tick, .dot.miss .cross { display: block; }

  .pitch {
    flex: 1; min-height: 0;
    border-radius: 24px; overflow: hidden;
    background: #4CB86B;
    position: relative;
  }
  .pitch svg { display: block; width: 100%; height: 100%; }
  #ball { cursor: pointer; outline: none; }
  #ball:focus-visible .ball-ring { stroke: #fff; stroke-width: 4; }
  .banner { opacity: 0; }
  .banner.show { opacity: 1; animation: bump .4s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes bump { 0% { transform: scale(.5); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .net-flash { opacity: 0; transition: opacity .2s; }
  .net-flash.show { opacity: 1; }
</style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <a class="round-btn" href="../" aria-label="Back to games">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1>Penalty Kick</h1>
    <button class="round-btn" type="button" id="restart" aria-label="New game">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>

  <div class="score">
    <div class="score-goals"><span class="stat-label">Goals</span><span class="stat-value" id="goals">0</span></div>
    <div class="dots" id="dots" role="img" aria-label="0 of 5 kicks taken"></div>
  </div>

  <div class="pitch">
    <svg id="field" viewBox="0 0 412 520" preserveAspectRatio="xMidYMin meet" aria-label="Football pitch">
      <defs>
        <pattern id="crowd" width="26" height="22" patternUnits="userSpaceOnUse">
          <circle cx="7" cy="8" r="5" fill="#E5484D"/>
          <circle cx="20" cy="8" r="5" fill="#F5B800"/>
          <circle cx="13" cy="19" r="5" fill="#A9D8F5"/>
        </pattern>
        <pattern id="net" width="16" height="16" patternUnits="userSpaceOnUse">
          <path d="M0 0H16M0 0V16" stroke="#fff" stroke-opacity=".45" stroke-width="1.5" fill="none"/>
        </pattern>
        <pattern id="stripes" width="412" height="112" patternUnits="userSpaceOnUse">
          <rect width="412" height="56" fill="#4CB86B"/>
          <rect y="56" width="412" height="56" fill="#44AC61"/>
        </pattern>
      </defs>

      <rect width="412" height="520" fill="url(#stripes)"/>

      <!-- crowd -->
      <rect width="412" height="90" fill="#2B3A67"/>
      <rect y="6" width="412" height="74" fill="url(#crowd)" opacity=".85"/>
      <rect y="82" width="412" height="8" fill="#1D2B4F"/>

      <!-- goal -->
      <rect x="16" y="130" width="380" height="140" fill="rgba(255,255,255,.14)"/>
      <rect x="16" y="130" width="380" height="140" fill="url(#net)"/>
      <rect class="net-flash" id="netFlash" x="16" y="130" width="380" height="140" fill="rgba(255,255,255,.35)"/>
      <path d="M16 270V130H396V270" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>

      <!-- markings -->
      <rect y="268" width="412" height="4" fill="#fff"/>
      <path d="M76 270V340H336V270" fill="none" stroke="#fff" stroke-width="4"/>
      <path d="M126 444A110 110 0 0 0 286 444" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="206" cy="395" r="6" fill="#fff"/>

      <!-- goalkeeper -->
      <ellipse id="keeperShadow" cx="206" cy="271" rx="30" ry="6" fill="rgba(0,0,0,.2)"/>
      <!-- Goalie is drawn with his feet at (0,0); JS moves, lifts and tilts him -->
      <g id="keeper">
        <!-- legs + boots -->
        <path d="M-10 -30V-9M10 -30V-9" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
        <path d="M-10 -22V-17M10 -22V-17" stroke="#FF8A3D" stroke-width="10"/>
        <ellipse cx="-12" cy="-5" rx="10" ry="6" fill="#1D2B4F"/>
        <ellipse cx="12" cy="-5" rx="10" ry="6" fill="#1D2B4F"/>
        <!-- shorts -->
        <rect x="-20" y="-42" width="40" height="17" rx="7" fill="#1D2B4F"/>
        <!-- arms: resting -->
        <g id="armsDown">
          <path d="M-18 -66Q-32 -60 -35 -45M18 -66Q32 -60 35 -45" fill="none" stroke="#FF8A3D" stroke-width="10" stroke-linecap="round"/>
          <ellipse cx="-36" cy="-40" rx="10" ry="11" fill="#C6F432" stroke="#1D2B4F" stroke-width="2.5"/>
          <ellipse cx="36" cy="-40" rx="10" ry="11" fill="#C6F432" stroke="#1D2B4F" stroke-width="2.5"/>
          <path d="M-40 -44V-36M-36 -46V-35M-32 -44V-36M32 -44V-36M36 -46V-35M40 -44V-36" stroke="#1D2B4F" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>
        </g>
        <!-- arms: reaching up -->
        <g id="armsUp" style="display:none">
          <path d="M-17 -68Q-27 -88 -26 -114M17 -68Q27 -88 26 -114" fill="none" stroke="#FF8A3D" stroke-width="10" stroke-linecap="round"/>
          <ellipse cx="-27" cy="-121" rx="11" ry="12" fill="#C6F432" stroke="#1D2B4F" stroke-width="2.5"/>
          <ellipse cx="27" cy="-121" rx="11" ry="12" fill="#C6F432" stroke="#1D2B4F" stroke-width="2.5"/>
          <path d="M-31 -126V-117M-27 -128V-116M-23 -126V-117M23 -126V-117M27 -128V-116M31 -126V-117" stroke="#1D2B4F" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>
        </g>
        <!-- jersey -->
        <rect x="-23" y="-76" width="46" height="40" rx="15" fill="#FF8A3D"/>
        <path d="M-9 -76Q0 -68 9 -76" fill="#E86A1C"/>
        <text x="0" y="-45" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">1</text>
        <!-- head -->
        <circle cx="-25" cy="-92" r="5" fill="#EBB892"/>
        <circle cx="25" cy="-92" r="5" fill="#EBB892"/>
        <circle cx="0" cy="-94" r="25" fill="#F5CBA7"/>
        <path d="M-25 -97C-26 -122 -6 -125 2 -121C14 -127 29 -116 25 -97C20 -106 12 -108 6 -106C0 -112 -10 -110 -14 -104C-18 -106 -22 -103 -25 -97Z" fill="#6B4226"/>
        <ellipse cx="-9" cy="-92" rx="4.2" ry="5.4" fill="#1D2B4F"/>
        <ellipse cx="9" cy="-92" rx="4.2" ry="5.4" fill="#1D2B4F"/>
        <circle cx="-7.5" cy="-94.2" r="1.7" fill="#FFFFFF"/>
        <circle cx="10.5" cy="-94.2" r="1.7" fill="#FFFFFF"/>
        <ellipse cx="-16" cy="-84" rx="5" ry="3.2" fill="#F28B9B" opacity=".75"/>
        <ellipse cx="16" cy="-84" rx="5" ry="3.2" fill="#F28B9B" opacity=".75"/>
        <path id="mouthSmile" d="M-6 -82Q0 -76 6 -82" fill="none" stroke="#1D2B4F" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse id="mouthOpen" cx="0" cy="-79.5" rx="4" ry="4.8" fill="#B23A48" style="display:none"/>
      </g>

      <!-- aim arrow -->
      <g id="arrow">
        <path d="M206 267L217 291H210V361H202V291H195Z" fill="#FF7A59" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      </g>

      <!-- ball -->
      <g id="ball" role="button" tabindex="0" aria-label="Kick the ball">
        <circle r="56" fill="transparent"/>
        <circle class="ball-ring" r="27" fill="#fff" stroke="#1D2B4F" stroke-width="3"/>
        <polygon points="0,-10 9.5,-3 6,8 -6,8 -9.5,-3" fill="#1D2B4F"/>
        <path d="M0 -10V-24M9.5 -3L22 -8M6 8L14 20M-6 8L-14 20M-9.5 -3L-22 -8" stroke="#1D2B4F" stroke-width="2.5" fill="none"/>
      </g>

      <!-- result banners -->
      <g class="banner" id="bGoal">
        <rect x="96" y="300" width="220" height="74" rx="28" fill="#22804F"/>
        <rect x="96" y="294" width="220" height="74" rx="28" fill="#2FA86B"/>
        <text x="206" y="348" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="52" fill="#fff">GOAL!</text>
      </g>
      <g class="banner" id="bSave">
        <rect x="96" y="300" width="220" height="74" rx="28" fill="#0F1A33"/>
        <rect x="96" y="294" width="220" height="74" rx="28" fill="#1D2B4F"/>
        <text x="206" y="346" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="46" fill="#fff">Saved!</text>
      </g>
      <g class="banner" id="bPost">
        <rect x="66" y="300" width="280" height="74" rx="28" fill="#C46A14"/>
        <rect x="66" y="294" width="280" height="74" rx="28" fill="#F28C28"/>
        <text x="206" y="345" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="40" fill="#1D2B4F">Hit the post!</text>
      </g>
    </svg>
  </div>

  <p class="hint">Tap the ball to kick!</p>
</main>

<div class="overlay" id="done" role="dialog" aria-modal="true" aria-labelledby="done-title">
  <div class="overlay-card">
    <svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="#F5B800"/></svg>
    <h2 id="done-title">Great kicking!</h2>
    <p id="done-text">You scored 0 out of 5!</p>
    <button class="big-btn" type="button" id="again">Play again</button>
    <a class="text-link" href="../">Back to games</a>
  </div>
</div>

<script>
(function () {
  // ---- Tuning: change these to make it easier or harder ----
  var KEEPER_PERIOD = 3.2;   // seconds for the goalie to slide left→right→left
  var ARROW_SWING = 1.7;     // seconds for the arrow to swing from one side to the other
  var REACH_UP = 42;         // straight-up jump: saves shots this close (px) to the goalie
  var REACH_DIVE = 70;       // 70° side dive: saves shots this close (px) to the goalie
  var STRAIGHT_ZONE = 24;    // shots closer than this get the straight-up jump, others the dive
  var KICKS = 5;

  // ---- Pitch geometry (SVG units) ----
  var CX = 206, BALL_Y = 395, NET_Y = 175, DEPTH = 220;
  var FEET_Y = 268, KEEPER_AMP = 150, POST_AT = 182;
  var JUMP = 50, JUMP_MS = 1100, SHOT_MS = 650;
  var DIVE_ANGLE = 70;                                            // degrees above the ground
  var DIVE_X = JUMP / Math.tan(DIVE_ANGLE * Math.PI / 180);        // sideways travel at the top
  var DIVE_TILT = 90 - DIVE_ANGLE;                                 // body leans with the dive
  var PIVOT = 55;                                                  // tilt around the tummy

  var $ = function (id) { return document.getElementById(id); };
  var keeper = $('keeper'), shadow = $('keeperShadow'), armsUp = $('armsUp'), armsDown = $('armsDown');
  var mouthSmile = $('mouthSmile'), mouthOpen = $('mouthOpen');
  var arrow = $('arrow'), ball = $('ball'), netFlash = $('netFlash');
  var banners = { goal: $('bGoal'), save: $('bSave'), post: $('bPost') };
  var dotsEl = $('dots'), goalsEl = $('goals'), done = $('done'), doneText = $('done-text');

  var TICK = '<svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CROSS = '<svg class="cross" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  var s;
  function reset() {
    s = { phase: 'aim', tk: Math.random() * KEEPER_PERIOD, ta: Math.random() * ARROW_SWING * 2,
          kicks: [], shot: null };
    done.classList.remove('show');
    hideBanners();
    renderDots();
  }

  function keeperX(tk) { return CX + KEEPER_AMP * Math.sin(2 * Math.PI * tk / KEEPER_PERIOD); }
  function arrowDeg(ta) {
    var u = (ta / ARROW_SWING) % 2;
    var tri = u < 1 ? u : 2 - u;
    return -45 + 90 * tri;           // swings between -45° and +45° (a 90° sweep)
  }

  function renderDots() {
    var html = '';
    var goals = 0;
    for (var i = 0; i < KICKS; i++) {
      var k = s.kicks[i];
      if (k === 'goal') goals++;
      html += '<div class="dot ' + (k === 'goal' ? 'goal' : k ? 'miss' : '') + '">' + TICK + CROSS + '</div>';
    }
    dotsEl.innerHTML = html;
    dotsEl.setAttribute('aria-label', s.kicks.length + ' of ' + KICKS + ' kicks taken, ' + goals + ' goals');
    goalsEl.textContent = goals;
    return goals;
  }

  function hideBanners() {
    for (var k in banners) banners[k].classList.remove('show');
    netFlash.classList.remove('show');
  }

  // Where the goalie is at `el` ms into his jump.
  function pose(kx, sh, el) {
    var h = Math.sin(Math.PI * Math.min(1, Math.max(0, el) / JUMP_MS));
    var dive = sh && sh.mode === 'dive';
    return {
      x: kx + (dive ? sh.dir * DIVE_X * h : 0),
      lift: JUMP * h,
      tilt: dive ? sh.dir * DIVE_TILT * h : 0
    };
  }
  // A point drawn at (lx, ly) on the goalie, in pitch coordinates.
  function bodyPoint(pz, lx, ly) {
    var r = pz.tilt * Math.PI / 180, dy = ly + PIVOT;
    return {
      x: pz.x + lx * Math.cos(r) - dy * Math.sin(r),
      y: FEET_Y - pz.lift - PIVOT + lx * Math.sin(r) + dy * Math.cos(r)
    };
  }

  function kick() {
    if (s.phase !== 'aim' || s.kicks.length >= KICKS) return;
    var deg = arrowDeg(s.ta);
    var kx = keeperX(s.tk);
    var xt = CX + Math.tan(deg * Math.PI / 180) * DEPTH * 0.86;
    var dx = xt - kx;
    var sh = { t0: performance.now(), deg: deg, kx: kx,
               dir: dx < 0 ? -1 : 1,
               mode: Math.abs(dx) <= STRAIGHT_ZONE ? 'up' : 'dive' };
    var reach = sh.mode === 'up' ? REACH_UP : REACH_DIVE;
    sh.ex = xt; sh.ey = NET_Y;
    if (Math.abs(xt - CX) > POST_AT) {
      sh.outcome = 'post';
      sh.ex = CX + (xt > CX ? 1 : -1) * 190; sh.ey = 200;
    } else if (Math.abs(dx) < reach) {
      sh.outcome = 'save';
      var hands = bodyPoint(pose(kx, sh, SHOT_MS), 0, -121);
      sh.ex = hands.x; sh.ey = hands.y;
    } else {
      sh.outcome = 'goal';
    }
    s.phase = 'shot';
    s.shot = sh;
  }

  ball.addEventListener('pointerdown', function (e) { e.preventDefault(); kick(); });
  ball.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); kick(); }
  });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    var bx = CX, by = BALL_Y, bs = 1, deg;
    var pz = { x: keeperX(s.tk), lift: 0, tilt: 0 };

    if (s.phase === 'aim') {
      if (s.kicks.length < KICKS) { s.tk += dt; s.ta += dt; }
      deg = arrowDeg(s.ta);
      pz.x = keeperX(s.tk);
    } else {
      var sh = s.shot, el = now - sh.t0;
      var p = Math.min(1, el / SHOT_MS);
      var e = 1 - Math.pow(1 - p, 3);
      pz = pose(sh.kx, sh, el);
      bx = CX + (sh.ex - CX) * e;
      by = BALL_Y + (sh.ey - BALL_Y) * e;
      bs = 1 - 0.4 * e;
      if (sh.outcome === 'save' && p >= 1) {
        // caught: the ball stays in his gloves (or hugged to his tummy once he lands)
        var held = pz.lift > 6 ? bodyPoint(pz, 0, -121) : bodyPoint(pz, 0, -58);
        bx = held.x; by = held.y;
      }
      deg = sh.deg;

      if (s.phase === 'shot' && p >= 1) {
        s.phase = 'result';
        s.kicks.push(sh.outcome === 'goal' ? 'goal' : 'miss');
        banners[sh.outcome].classList.add('show');
        if (sh.outcome === 'goal') netFlash.classList.add('show');
        if (navigator.vibrate) { try { navigator.vibrate(sh.outcome === 'goal' ? [40, 60, 40] : 30); } catch (err) {} }
        var goals = renderDots();
        sh.until = now + 1500;
        if (s.kicks.length >= KICKS) {
          doneText.textContent = 'You scored ' + goals + ' out of ' + KICKS + '!';
        }
      }
      if (s.phase === 'result' && now > sh.until) {
        hideBanners();
        s.phase = 'aim';
        s.shot = null;
        if (s.kicks.length >= KICKS) done.classList.add('show');
      }
    }

    keeper.setAttribute('transform',
      'translate(' + pz.x + ' ' + (FEET_Y - pz.lift) + ') rotate(' + pz.tilt + ' 0 ' + (-PIVOT) + ')');
    shadow.setAttribute('cx', pz.x);
    shadow.setAttribute('rx', 30 - pz.lift * 0.18);
    var up = pz.lift > 6;
    armsUp.style.display = up ? '' : 'none';
    armsDown.style.display = up ? 'none' : '';
    mouthOpen.style.display = up ? '' : 'none';
    mouthSmile.style.display = up ? 'none' : '';

    arrow.setAttribute('transform', 'rotate(' + deg + ' ' + CX + ' ' + BALL_Y + ')');
    arrow.style.display = (s.phase === 'aim' && s.kicks.length < KICKS) ? '' : 'none';
    ball.setAttribute('transform', 'translate(' + bx + ' ' + by + ') scale(' + bs + ')');

    requestAnimationFrame(frame);
  }

  $('restart').addEventListener('click', reset);
  $('again').addEventListener('click', reset);
  reset();
  requestAnimationFrame(frame);
})();
</script>
<script src="../assets/sw-register.js"></script>
</body>
</html>
