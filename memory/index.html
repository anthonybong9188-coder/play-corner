<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Lights · Play Corner</title>
<meta name="theme-color" content="#F4F8FC">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .screen { height: 100dvh; min-height: 0; }
  .stats { display: flex; gap: 10px; }
  .stat .hearts { display: flex; gap: 4px; }
  .stat .hearts svg { width: 24px; height: 24px; }
  .stat .hearts svg.off { opacity: .18; filter: grayscale(1); }
  .status { text-align: center; font-family: var(--display); font-weight: 800; font-size: 28px; margin: 0; min-height: 36px; }
  .status.go { color: var(--ok); }
  .pads { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .pad {
    appearance: none; border: 0; padding: 8px; cursor: pointer; min-height: 0; border-radius: 32px;
    display: flex; align-items: center; justify-content: center; position: relative;
    transition: transform .12s, filter .12s, box-shadow .12s; filter: saturate(.55) brightness(1.08);
  }
  .pad svg { height: 82%; width: auto; max-width: 100%; pointer-events: none; }
  .pad.lit { filter: none; transform: scale(1.05); box-shadow: 0 0 0 6px #fff, 0 0 26px 10px var(--glow) !important; }
  .pad:disabled { cursor: default; }
  .pad[data-i="0"] { background: #7CD67F; box-shadow: 0 7px 0 #3E9E44; --glow: #7CD67F; }
  .pad[data-i="1"] { background: #B69CFF; box-shadow: 0 7px 0 #7C5CD6; --glow: #B69CFF; }
  .pad[data-i="2"] { background: #6FA8FF; box-shadow: 0 7px 0 #2F6FED; --glow: #6FA8FF; }
  .pad[data-i="3"] { background: #FF8F8F; box-shadow: 0 7px 0 #D9573A; --glow: #FF8F8F; }
  .pad.wrong { animation: no .4s ease-in-out; }
  @keyframes no { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .go-btn { max-width: 100%; }
</style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <a class="round-btn" href="../" aria-label="Back to games">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1>Memory Lights</h1>
    <button class="round-btn" type="button" id="restart" aria-label="Start over">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>

  <div class="stats">
    <div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="level">1</span></div>
    <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
    <div class="stat"><div class="hearts" id="hearts" role="img"></div></div>
  </div>

  <p class="status" id="status" aria-live="polite">Ready?</p>

  <div class="pads" id="pads"></div>

  <button class="big-btn go-btn" type="button" id="go">Start</button>
</main>

<div class="overlay" id="over" role="dialog" aria-modal="true" aria-labelledby="over-title">
  <div class="overlay-card">
    <svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="#F5B800"/></svg>
    <h2 id="over-title">Great remembering!</h2>
    <p id="over-text"></p>
    <button class="big-btn" type="button" id="again">Play again</button>
    <a class="text-link" href="../">Back to games</a>
  </div>
</div>

<script src="../assets/animals.js"></script>
<script src="../assets/sfx.js"></script>
<script>
(function () {
  var PADS = [{ a: 'frog', note: 392.0 }, { a: 'chick', note: 523.25 }, { a: 'dog', note: 659.25 }, { a: 'cat', note: 783.99 }];
  var LIVES = 3;
  var $ = function (id) { return document.getElementById(id); };
  var padsEl = $('pads'), statusEl = $('status'), goBtn = $('go');
  var seq, pos, lives, accepting = false, best = 0, timers = [];
  try { best = +localStorage.getItem('pc-memory-best') || 0; } catch (e) {}

  var pads = PADS.map(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pad'; b.dataset.i = i; b.disabled = true;
    b.setAttribute('aria-label', p.a);
    b.innerHTML = PC.animal(p.a, 'idle');
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); press(i); });
    padsEl.appendChild(b);
    return b;
  });

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function status(t, go) { statusEl.textContent = t; statusEl.classList.toggle('go', !!go); }

  function light(i, ms) {
    var b = pads[i];
    b.classList.add('lit'); b.innerHTML = PC.animal(PADS[i].a, 'happy');
    PC.sfx.note(PADS[i].note, ms / 1000);
    later(function () { b.classList.remove('lit'); b.innerHTML = PC.animal(PADS[i].a, 'idle'); }, ms);
  }

  function renderStats() {
    $('level').textContent = Math.max(1, seq.length);
    $('best').textContent = best;
    var h = '';
    for (var i = 0; i < LIVES; i++) h += '<svg viewBox="0 0 24 24" class="' + (i < lives ? '' : 'off') + '"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#E5484D"/></svg>';
    $('hearts').innerHTML = h;
    $('hearts').setAttribute('aria-label', lives + ' hearts left');
  }

  function playSequence() {
    accepting = false; pos = 0;
    pads.forEach(function (b) { b.disabled = true; });
    status('Watch…');
    var step = Math.max(380, 700 - seq.length * 25), on = Math.round(step * 0.7);
    seq.forEach(function (i, k) { later(function () { light(i, on); }, 600 + k * step); });
    later(function () {
      accepting = true;
      pads.forEach(function (b) { b.disabled = false; });
      status('Your turn!', true);
    }, 600 + seq.length * step);
  }

  function press(i) {
    PC.sfx.unlock();
    if (!accepting) return;
    light(i, 260);
    if (i !== seq[pos]) {
      accepting = false;
      lives--;
      pads[i].classList.remove('wrong'); void pads[i].offsetWidth; pads[i].classList.add('wrong');
      PC.sfx.oops();
      renderStats();
      if (lives <= 0) return later(gameOver, 700);
      status('Oops! Watch again…');
      return later(playSequence, 1100);
    }
    pos++;
    if (pos === seq.length) {
      accepting = false;
      var made = seq.length;
      if (made > best) { best = made; try { localStorage.setItem('pc-memory-best', best); } catch (e) {} }
      later(function () { PC.sfx.yum(); status(['Yes!', 'Super!', 'Well done!', 'Great!'][made % 4], true); }, 300);
      later(function () { seq.push(Math.floor(Math.random() * 4)); renderStats(); playSequence(); }, 1400);
    }
  }

  function gameOver() {
    var got = seq.length - 1;
    $('over-text').textContent = got > 0 ? 'You remembered ' + got + ' in a row!' : 'Have another go!';
    $('over').classList.add('show');
    PC.sfx.tada();
    status('Ready?');
  }

  function start() {
    clearTimers();
    $('over').classList.remove('show');
    seq = [Math.floor(Math.random() * 4)];
    lives = LIVES;
    renderStats();
    goBtn.hidden = true;
    playSequence();
  }

  goBtn.addEventListener('click', function () { PC.sfx.unlock(); start(); });
  $('again').addEventListener('click', start);
  $('restart').addEventListener('click', function () { PC.sfx.unlock(); start(); });
  window.__mem = { get state() { return { seq: seq ? seq.slice() : [], pos: pos, lives: lives, accepting: accepting, best: best }; } };
  seq = []; lives = LIVES; renderStats();
})();
</script>
<script src="../assets/sw-register.js"></script>
</body>
</html>
