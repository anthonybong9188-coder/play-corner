# GitLab Pages: publish the site (everything except tests) from the default branch.
image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - find . -mindepth 1 -maxdepth 1 ! -name public ! -name .git ! -name tests ! -name .gitlab-ci.yml -exec cp -r {} public/ \;
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
