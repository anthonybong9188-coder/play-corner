<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Betrayal Battlefield · Play Corner</title>
<meta name="theme-color" content="#101010">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<style>:root{color-scheme:dark;background:#101010}html,body{margin:0;min-height:100%;background:#101010}body{padding:16px;display:flex;justify-content:center;align-items:flex-start}</style>
<style>
  body{flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  .bb-top{width:100%;max-width:600px;display:flex;align-items:center;gap:12px;margin:0 auto 10px}
  .bb-back{width:48px;height:48px;flex-shrink:0;border-radius:24px;background:#27261f;border:1px solid #6a6047;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .bb-back:active{transform:translateY(1px);background:#776033}
  .bb-back:focus-visible{outline:3px solid #ffe49b;outline-offset:2px}
  .bb-title{margin:0;color:#f2e8c9;font:800 20px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.5px}
  #betrayal-battlefield{width:100%}
</style>
</head>
<body>
<div class="bb-top">
  <a class="bb-back" href="../" aria-label="Back to games">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f2e8c9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <h1 class="bb-title">Betrayal Battlefield</h1>
</div>
<div id="betrayal-battlefield" aria-label="Playable retro fantasy battlefield">
  <style>
    #betrayal-battlefield{max-width:600px;margin:0 auto;color:#eee5c8;font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
    #betrayal-battlefield *{box-sizing:border-box}
    #betrayal-battlefield .screen{position:relative;background:#101010;border:3px solid #262626;overflow:hidden}
    #betrayal-battlefield canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:auto;touch-action:none;background:#36c8d2}
    #betrayal-battlefield .vitals{position:absolute;left:8px;right:8px;top:7px;display:flex;justify-content:space-between;pointer-events:none}
    #betrayal-battlefield .vital{width:34%;color:#fff;font-size:10px;text-shadow:1px 1px #111;letter-spacing:.3px}
    #betrayal-battlefield .vital:last-child{text-align:right}
    #betrayal-battlefield .meter{height:5px;background:#222;margin-top:2px;box-shadow:0 0 0 1px #ded0a0}
    #betrayal-battlefield .fill{height:100%;background:#e1d54d;transition:width .25s}
    #betrayal-battlefield .vital:last-child .fill{margin-left:auto;background:#e57b51}
    #betrayal-battlefield .caption{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 2px;color:#bdb79e;font-size:12px}
    #betrayal-battlefield .caption strong{color:#e7dab8;letter-spacing:.6px}
    #betrayal-battlefield .controls{display:grid;grid-template-columns:repeat(5,minmax(44px,1fr));gap:7px;max-width:390px;margin:8px auto 0}
    #betrayal-battlefield .controls button{height:52px;border:1px solid #6a6047;border-radius:7px;background:#27261f;color:#f2e8c9;font:700 18px system-ui;touch-action:none;user-select:none;cursor:pointer}
    #betrayal-battlefield .controls button.attack{background:#a13d34;color:white;font-size:13px;letter-spacing:.4px}
    #betrayal-battlefield .controls button.cooling{background:#5a2d29;color:#c9a8a2}
    #betrayal-battlefield .replay{display:block;width:min(100%,390px);height:46px;margin:8px auto 0;border:1px solid #c6a45c;border-radius:7px;background:#c6a45c;color:#10130f;font:800 13px system-ui;letter-spacing:.7px;cursor:pointer}
    #betrayal-battlefield .replay[hidden]{display:none}
    #betrayal-battlefield .controls button:active{transform:translateY(1px);background:#776033}
    #betrayal-battlefield .controls button:focus-visible{outline:3px solid #ffe49b;outline-offset:2px}
    #betrayal-battlefield .hint{text-align:center;color:#9b988a;font-size:11px;margin:7px 0 0}
    @media(max-width:360px){#betrayal-battlefield .controls{gap:4px}#betrayal-battlefield .controls button{height:46px}}
  </style>
  <div class="screen">
    <canvas id="bb-canvas" width="640" height="480" role="img" aria-label="Pixel-art battle in two rows: your front-row fighter against a rival, with a second duel behind"></canvas>
    <div class="vitals" aria-hidden="true">
      <div class="vital">YOUR ARMY<div class="meter"><div class="fill" id="bb-player-hp" style="width:100%"></div></div></div>
      <div class="vital">RIVAL ARMY<div class="meter"><div class="fill" id="bb-enemy-hp" style="width:100%"></div></div></div>
    </div>
  </div>
  <div class="caption"><strong id="bb-status" aria-live="polite">REAL-TIME FIGHT</strong><span id="bb-health">20 · 20</span></div>
  <div class="controls" aria-label="Battle controls">
    <button type="button" data-action="left" aria-label="Move left">◀</button>
    <button type="button" data-action="up" aria-label="Jump">▲</button>
    <button type="button" data-action="attack" class="attack" aria-label="Attack">ATTACK</button>
    <button type="button" data-action="down" aria-label="Crouch">▼</button>
    <button type="button" data-action="right" aria-label="Move right">▶</button>
  </div>
  <button type="button" class="replay" id="bb-replay" hidden>PLAY AGAIN</button>
  <p class="hint">You lead the front row · the back row fights on its own · both rows draw from the same 20 fighters · every swing needs a moment to recover</p>
  <script>
    (()=>{
      const root=document.getElementById('betrayal-battlefield');
      const canvas=root.querySelector('#bb-canvas');
      const mainCtx=canvas.getContext('2d');mainCtx.imageSmoothingEnabled=true;mainCtx.imageSmoothingQuality='high';let ctx=mainCtx;
      const replay=root.querySelector('#bb-replay');
      const atkBtn=root.querySelector('[data-action=attack]');
      const DPR=2;                 // canvas pixels per logical pixel
      const SW=320,SH=240;         // screen, in logical pixels
      const W=320,H=200;           // one row's own drawing space (fighters stand on y=42, feet at ~171)

      // ---- Rules ----
      const ARMY_SIZE=20;
      const TYPES=['troll','axe','sword','morningstar'];
      const SWING_MS=900;          // full swing animation
      const IMPACT_MS=600;         // when the blow lands
      const RECOVER_MS=500;        // extra recovery after every swing before the next one (both sides)
      const SPEED=50;               // everyone walks at this one speed (px/s): no sprinting, no rushing
      const AI_SMART=.6, AI_HOLD=.5; // how often the rival spots your swing / chooses to wait for you
      const LANES={back:{s:.68,ox:160*(1-.68),oy:12},front:{s:1,ox:0,oy:36}};

      // ---- Sprite sheets ----
      const trollSheet=new Image();trollSheet.src='img/troll.png';
      const humanSheet=new Image();humanSheet.src='img/humans.png';
      // Six-frame human attacks (axe/sword/morningstar).
      const humanAttackSheet=new Image();humanAttackSheet.src='img/human-attacks.png';
      // Seven-frame deaths, re-packed so every frame sits whole in its own cell, feet on the cell's bottom edge.
      const deathSheet=new Image();deathSheet.src='img/deaths.png';
      const DEATH={human:{y:0,cw:292,ch:276,h0:272,stand:59},troll:{y:276,cw:313,ch:305,h0:301,stand:82}};
      const FEET=171-42;           // feet line below a fighter's y

      const held=new Set();
      // Contact is judged on the drawn pixels: each fighter is rendered off-screen in its current pose and a strike lands only when the two silhouettes touch.
      const maskCtx=[0,1].map(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c.getContext('2d',{willReadFrequently:true})});
      function silhouette(i,fn){const c=maskCtx[i],prev=ctx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);ctx=c;try{fn()}finally{ctx=prev}return c.getImageData(0,0,W,H).data}
      const frontCache={};
      function front(type,flip){
        const sheet=type==='troll'?trollSheet:humanAttackSheet;
        if(!sheet.complete||!sheet.naturalWidth)return null;
        const key=type+(flip?'L':'R');if(key in frontCache)return frontCache[key];
        const d=silhouette(0,()=>drawFighter(type,100,42,flip,0,false,0));let lo=1e9,hi=-1;
        for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>128){if(x<lo)lo=x;if(x>hi)hi=x}
        return frontCache[key]=(flip?lo:hi)-100;
      }
      const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))};
      const poly=(pts,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()};
      const rand=(a,b)=>a+Math.random()*(b-a);

      function scenery(){
        rect(0,0,SW,SH,'#40ccd2');
        // Layered, blocky mountain skyline and distant ridge.
        poly([[0,9],[10,12],[20,3],[30,17],[41,1],[52,22],[63,7],[76,26],[87,11],[98,21],[109,8],[121,27],[135,15],[150,30],[166,13],[181,27],[194,7],[208,23],[223,0],[238,18],[251,4],[268,25],[281,11],[294,28],[307,8],[320,15],[320,54],[0,54]],'#3348a3');
        poly([[0,32],[14,24],[28,31],[43,19],[55,39],[68,16],[83,32],[98,24],[115,41],[130,26],[148,36],[164,20],[180,38],[198,23],[211,36],[230,18],[248,37],[262,20],[279,40],[296,22],[310,34],[320,27],[320,58],[0,58]],'#5964ce');
        poly([[0,47],[25,41],[42,50],[64,39],[82,49],[100,43],[120,54],[142,41],[160,51],[183,42],[206,54],[228,39],[251,51],[274,42],[296,52],[320,43],[320,67],[0,67]],'#6655b0');
        rect(0,58,SW,10,'#a9dd9a');rect(0,66,SW,150,'#13c61d');
        // A slightly worn strip where each row fights.
        rect(0,124,SW,8,'#11b51b');rect(0,200,SW,10,'#11b51b');
        // Field flecks, tufts and stones.
        const flecks=[[4,85,5,2,'#29862b'],[24,112,7,2,'#f6d850'],[47,77,4,2,'#b7e747'],[70,146,8,2,'#744d29'],[88,93,3,2,'#fff05b'],[117,120,8,2,'#267f37'],[141,78,5,2,'#f5d94c'],[171,153,7,2,'#89623d'],[197,89,5,2,'#eee260'],[222,142,9,2,'#435ca2'],[247,80,7,2,'#e7d247'],[277,160,9,2,'#8e6d40'],[302,96,6,2,'#ffec54'],[12,171,10,3,'#60523a'],[53,183,11,2,'#e6d447'],[106,173,7,3,'#65706b'],[186,184,9,2,'#eee25a'],[238,174,7,3,'#5c6466'],[292,185,10,2,'#dbd052']];
        for(const [x,y,w,h,c] of flecks)rect(x,y,w,h,c);
        for(const [x,y] of [[20,138],[35,89],[77,179],[128,104],[154,166],[212,107],[264,150],[313,118]]){rect(x,y,2,7,'#80dc37');rect(x-3,y+2,3,2,'#a4ed51');rect(x+2,y+1,3,2,'#9de544')}
        rect(0,212,SW,28,'#171b1a');
      }
      function drawTroll(x,y,flip=false,jump=0,flash=false,swing=0){
        if(!trollSheet.complete||!trollSheet.naturalWidth)return;
        const frame=swing<=0?0:Math.min(7,Math.floor(swing*8));
        const fw=96,dw=122,dh=130,sx=dw/87,sy=dh/94,drawW=fw*sx,drawH=128*sy,drawX=-5*sx,drawY=-28*sy;
        ctx.save();ctx.translate(x+(flip?dw:0),y-jump);ctx.scale(flip?-1:1,1);
        ctx.drawImage(trollSheet,frame*fw,0,fw,128,drawX,drawY,drawW,drawH);
        ctx.restore();
      }
      function drawHumanFallback(x,y,kind,flip=false,jump=0,flash=false,swing=0){
        const t=Math.max(0,Math.min(1,swing)),scale=1.1;
        ctx.save();ctx.translate(x+48,y+130-jump);ctx.scale(flip?-scale:scale,scale);
        rect(-5,-50,10,11,'#d9bd98');rect(-7,-51,14,5,'#aeb9b8');rect(-5,-55,11,5,'#d0d4ce');
        rect(-6,-39,12,3,'#e0b98f');rect(-9,-36,18,16,'#ca4b39');rect(-7,-35,5,11,'#eb674c');rect(3,-34,4,8,'#a9312e');
        rect(-8,-20,16,3,'#60462d');rect(-2,-20,5,3,'#e6c35b');
        rect(-7,-17,6,10,'#665a49');rect(1,-17,6,10,'#665a49');rect(-8,-7,8,3,'#292523');rect(0,-7,9,3,'#292523');
        rect(-12,-35,4,12,'#dcb58d');rect(8,-35,4,11,'#dcb58d');
        const angle=humanWeaponAngle(t),weaponY=-42,weaponLen=23;
        ctx.save();ctx.translate(8,weaponY);
        if(t>.32&&t<.76)drawHumanArcTrail(8,weaponY,weaponLen,angle,t);
        ctx.rotate(angle);
        if(kind==='axe'){
          rect(-1,-weaponLen,2,weaponLen,'#68492c');rect(-2,-weaponLen,10,3,'#d2d1c7');rect(5,-weaponLen-5,5,8,'#d9d8ce');rect(5,-weaponLen+1,5,7,'#abb5b5');rect(6,-weaponLen-4,2,5,'#f0ead7');
        }else if(kind==='sword'){
          rect(-2,-weaponLen,4,6,'#765130');rect(-5,-weaponLen+4,10,2,'#ddc66a');rect(-2,-weaponLen+6,4,weaponLen-7,'#bbc7c7');poly([[-2,-2],[0,2],[2,-2]],'#f1eee0');
        }else{
          rect(-1,-weaponLen,2,weaponLen-5,'#68492c');rect(-3,-weaponLen+7,6,3,'#aa7a45');rect(-5,-weaponLen-3,10,8,'#b5bdbb');rect(-4,-weaponLen-2,8,6,'#d5d8d2');rect(-5,-weaponLen-3,3,3,'#e4e7de');rect(2,-weaponLen+1,3,3,'#e4e7de');
        }
        ctx.restore();
        ctx.restore();
      }
      function humanAttackFrame(t){
        if(t<.10)return 0;
        if(t<.30)return 1; // weapon overhead
        if(t<.46)return 2; // early curved downswing
        if(t<.64)return 3; // continued arc
        if(t<.76)return 4; // impact
        if(t<.91)return 5; // recovery
        return 0;
      }
      function drawHuman(x,y,kind,flip=false,jump=0,flash=false,swing=0){
        const t=Math.max(0,Math.min(1,swing));
        if(humanAttackSheet.complete&&humanAttackSheet.naturalWidth){
          const row={axe:0,sword:1,morningstar:2}[kind]??1,frame=humanAttackFrame(t),cx=x+48,bottom=y+130-jump;
          ctx.save();ctx.translate(cx,bottom);ctx.scale(flip?-1:1,1);
          ctx.drawImage(humanAttackSheet,frame*300,row*300,300,300,-36,-72,72,72);
          ctx.restore();return;
        }
        drawHumanFallback(x,y,kind,flip,jump,flash,swing);
      }
      function humanWeaponAngle(t){
        if(t<=0)return 2.15;
        const keys=[[0,2.15],[.22,0],[.32,0],[.48,.78],[.66,1.82],[.74,2.42],[.91,2.15],[1,2.15]];
        for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const [a0,v0]=keys[i-1],[a1,v1]=keys[i],u=(t-a0)/(a1-a0),e=u*u*(3-2*u);return v0+(v1-v0)*e}}
        return 2.15;
      }
      function drawHumanArcTrail(x,y,r,angle,t){
        const end=angle-Math.PI/2,start=-Math.PI/2,progress=Math.max(0,Math.min(1,(t-.32)/.42));
        if(progress<=0)return;
        ctx.save();ctx.globalAlpha=.18+.52*Math.sin(progress*Math.PI);ctx.strokeStyle='#ffe69a';ctx.lineWidth=2;ctx.setLineDash([2,2]);
        ctx.beginPath();ctx.arc(x,y,r,start,end,false);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      }
      function drawFighter(type,x,y,flip=false,jump=0,flash=false,swing=0){if(type==='troll')drawTroll(x,y,flip,jump,flash,swing);else drawHuman(x,y,type,flip,jump,flash,swing)}
      function fighterLabel(type){return type==='troll'?'TROLL':type==='axe'?'AXEMAN':type==='sword'?'SWORDSMAN':'MORNINGSTAR FIGHTER'}
      // Visible middle of a fighter, and the top of its head (row coordinates).
      function centerX(f){return f.type==='troll'?(f.side==='L'?f.x+67:f.x+55):f.x+48}
      function headY(f){return (f.type==='troll'?f.y+46:f.y+71)-f.jump}

      // ---- Death: whole frames, feet kept on the fighter's own ground line ----
      function deathFrame(elapsed){
        if(elapsed<160)return 0;
        if(elapsed<370)return 1;
        if(elapsed<610)return 2;
        if(elapsed<850)return 3;
        if(elapsed<1120)return 4;
        if(elapsed<1450)return 5;
        return 6;
      }
      function drawDeath(type,cx,feet,flip,frame){
        if(!deathSheet.complete||!deathSheet.naturalWidth)return;
        const d=DEATH[type==='troll'?'troll':'human'],s=d.stand/d.h0;
        ctx.save();ctx.translate(cx,feet);ctx.scale(flip?-1:1,1);
        ctx.drawImage(deathSheet,frame*d.cw,d.y,d.cw,d.ch,-d.cw*s/2,-d.ch*s,d.cw*s,d.ch*s);
        ctx.restore();
      }
      function drawReserveSoldier(cx,y,kind,flip=false){
        if(humanSheet.complete&&humanSheet.naturalWidth){const cell={axe:0,sword:1,morningstar:2}[kind]??1;ctx.save();ctx.translate(cx+(flip?12:-12),y);ctx.scale(flip?-1:1,1);ctx.drawImage(humanSheet,cell*144,0,144,128,0,0,24,22);ctx.restore();}
      }
      function drawReserveTroll(cx,y,flip=false){
        if(!trollSheet.complete||!trollSheet.naturalWidth)return;
        ctx.save();ctx.translate(cx+(flip?12:-12),0);ctx.scale(flip?-1:1,1);ctx.drawImage(trollSheet,8,35,82,86,0,y-3,24,25);ctx.restore();
      }

      // ---- Reach, measured from the drawn pixels ----
      const MIN_TOUCH=12; // a graze of a few pixels is not a hit
      function bodyEdge(d,facingRight){
        const cols=new Int16Array(W);for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>128)cols[x]++;
        if(facingRight){for(let x=W-1;x>=0;x--)if(cols[x]>=30)return x}else{for(let x=0;x<W;x++)if(cols[x]>=30)return x}
        return facingRight?W-1:0;
      }
      const bodyFrontL=t=>front(t,false)??(t==='troll'?92:68);
      const bodyFrontR=t=>front(t,true)??(t==='troll'?30:28);
      const limitCache={};
      // Largest gap at which `side`'s contact pose touches the other's body.
      function strikeLimit(side,lt,rt){
        const key=side+lt+rt;if(key in limitCache)return limitCache[key];
        const pF=front(lt,false),eF=front(rt,true);
        if(pF==null||eF==null)return 8;
        const L=side==='L',strikeT=t=>t==='troll'?.68:.70,PX=60,EX=PX+pF-eF;
        const a=silhouette(0,()=>drawFighter(lt,PX,42,false,0,false,L?strikeT(lt):0));
        const b=silhouette(1,()=>drawFighter(rt,EX,42,true,0,false,L?0:strikeT(rt)));
        let limit=-80;const aEdge=bodyEdge(a,true),bEdge=bodyEdge(b,false);
        search:for(let gap=12;gap>=-80;gap--){
          let touch=0;
          for(let y=0;y<H;y++)for(let x=Math.max(0,gap);x<W;x++){
            const ai=(y*W+x)*4+3,bx=x-gap,bi=(y*W+bx)*4+3;
            if(a[ai]>128&&b[bi]>128&&(L?bx>=bEdge:x<=aEdge)&&++touch>=MIN_TOUCH){limit=gap;break search}
          }
        }
        return limitCache[key]=limit;
      }
      const closestGap=(lt,rt)=>Math.min(strikeLimit('L',lt,rt),strikeLimit('R',lt,rt))-14;
      const attackGap=(lt,rt)=>Math.min(strikeLimit('L',lt,rt),strikeLimit('R',lt,rt))-10;
      const outReach=(lt,rt)=>Math.max(strikeLimit('L',lt,rt),strikeLimit('R',lt,rt));
      const spacing=(lt,rt)=>bodyFrontL(lt)-bodyFrontR(rt)+closestGap(lt,rt);
      const gapOf=lane=>lane.R.x+bodyFrontR(lane.R.type)-(lane.L.x+bodyFrontL(lane.L.type));
      const swingT=(f,now)=>f.swing?Math.min(1,(now-f.swing)/SWING_MS):0;
      function weaponHitsBody(lane,side,now){
        const att=side==='L'?lane.L:lane.R;
        const t=swingT(att,now);
        const frame=att.type==='troll'?Math.min(7,Math.floor(t*8)):humanAttackFrame(t);
        if(frame!==(att.type==='troll'?5:4))return false; // only the contact pose can hurt
        const a=silhouette(0,()=>drawFighter(lane.L.type,lane.L.x,lane.L.y,false,lane.L.jump,false,swingT(lane.L,now)));
        const b=silhouette(1,()=>drawFighter(lane.R.type,lane.R.x,lane.R.y,true,lane.R.jump,false,swingT(lane.R,now)));
        const aEdge=bodyEdge(a,true),bEdge=bodyEdge(b,false);let touch=0;
        for(let y=0;y<H;y++)for(let x=0;x<W;x++){
          const i=(y*W+x)*4+3;
          if(a[i]>128&&b[i]>128&&(side==='L'?x>=bEdge:x<=aEdge)&&++touch>=MIN_TOUCH)return true;
        }
        return false;
      }

      // ---- Armies & rows ----
      let game;
      function makeArmy(){const a=[];for(let i=0;i<ARMY_SIZE;i++)a.push(TYPES[Math.floor(Math.random()*TYPES.length)]);return a}
      function makeFighter(side,type,lane,x){
        return {side,type,lane,x,y:42,jump:0,hp:10,state:'fight',swing:0,hitDone:false,ready:0,stun:0,knock:0,knockAt:0,flashUntil:0,
                ai:{mode:'approach',until:0,willHold:Math.random()<AI_HOLD,pad:rand(8,20),wait:0,rushAt:0},
                ctrl:(lane==='front'&&side==='L')?'player':'ai',entryFrom:x,entryTo:x,entryAt:0};
      }
      function newGame(){
        game={done:false,winner:'',status:'REAL-TIME FIGHT',statusAt:0,last:performance.now(),
          army:{L:makeArmy(),R:makeArmy()},
          lanes:{back:{id:'back',L:null,R:null,corpses:[]},front:{id:'front',L:null,R:null,corpses:[]}}};
        for(const id of ['front','back']){
          const lane=game.lanes[id];
          lane.L=makeFighter('L',game.army.L.shift(),id,56);
          lane.R=makeFighter('R',game.army.R.shift(),id,194);
        }
        held.clear();
      }
      const alive=f=>f&&(f.state==='fight'||f.state==='entry');
      const remaining=side=>game.army[side].length+['front','back'].reduce((n,id)=>n+(alive(game.lanes[id][side])?1:0),0);
      function say(msg,now){game.status=msg;game.statusAt=now}
      function who(f){return (f.side==='L'?'YOUR ':'RIVAL ')+fighterLabel(f.type)}

      function startSwing(f,now){
        if(f.state!=='fight'||f.swing||now<f.ready||now<f.stun||f.knock)return false;
        f.swing=now;f.hitDone=false;f.ready=now+SWING_MS+RECOVER_MS;
        return true;
      }
      // Keep each fighter on the field and out of the other's body.
      function moveTo(lane,f,x){
        const o=f.side==='L'?lane.R:lane.L;
        if(f.side==='L'){x=Math.max(25,Math.min(198,x));if(alive(o))x=Math.min(x,o.x-spacing(f.type,o.type))}
        else{x=Math.min(198,Math.max(25,x));if(alive(o))x=Math.max(x,o.x+spacing(o.type,f.type))}
        f.x=x;
      }
      const toward=(f,amt)=>f.side==='L'?f.x+amt:f.x-amt;

      // ---- The rival's brain (also runs both back-row fighters) ----
      function think(lane,f,op,now,dt){
        const A=f.ai;
        if(f.state!=='fight')return;
        if(!op||op.state!=='fight'){A.mode='approach';return}
        if(now<f.stun||f.knock)return;
        if(f.swing&&now-f.swing<SWING_MS)return;
        const lt=lane.L.type,rt=lane.R.type;
        const gap=gapOf(lane),atk=attackGap(lt,rt),reach=outReach(lt,rt),holdAt=reach+A.pad;
        const inRange=gap<=atk,canSwing=now>=f.ready;
        const opSwinging=op.swing&&now-op.swing<SWING_MS;
        const opRecovering=now<op.ready&&(!op.swing||now-op.swing>IMPACT_MS+90);
        const swing=(r0=70,r1=240)=>{if(!A.wait)A.wait=now+rand(r0,r1);if(now>=A.wait&&startSwing(f,now)){A.wait=0;A.mode='recover';return true}return false};
        // Sees a swing coming: (most of the time) refuses to walk into it, then punishes the recovery.
        if(opSwinging&&now-op.swing<IMPACT_MS+90&&!(f.swing)){
          if(A.seen!==op.swing){A.seen=op.swing;A.smart=Math.random()<AI_SMART}
          // Already inside your reach when you swing: it stands its ground (no stepping away).
          if(gap<=strikeLimit(op.side,lt,rt)){if(inRange&&canSwing)swing();return}
          if(A.smart){A.mode='punish';A.rushAt=op.swing+IMPACT_MS+110+rand(0,140);return}
        }
        switch(A.mode){
          case 'approach':
            if(inRange){if(canSwing)swing();break}
            if(A.willHold&&gap<=holdAt){A.mode='hold';A.until=now+rand(500,1900);break}
            moveTo(lane,f,toward(f,SPEED*dt));
            break;
          case 'hold':
            // Stand just out of reach and wait for the other to swing first.
            if(opRecovering&&canSwing){A.rushAt=now+rand(60,160);A.mode='punish';break}
            if(inRange&&canSwing){swing();break}
            if(gap<holdAt-4)moveTo(lane,f,toward(f,-SPEED*dt));
            if(now>A.until){
              const r=Math.random();
              if(r<.5){A.mode='approach';A.willHold=false}
              else if(r<.75){A.mode='back';A.until=now+rand(250,600)}
              else{A.until=now+rand(400,1200)}
            }
            break;
          case 'punish':
            // Rush in while the other is still recovering from the swing.
            if(now<A.rushAt)break;
            if(inRange){if(canSwing)swing(30,110);break}
            if(now>=op.ready&&!opSwinging){A.mode='approach';A.willHold=Math.random()<AI_HOLD;break}
            moveTo(lane,f,toward(f,SPEED*dt));
            break;
          case 'back':
            moveTo(lane,f,toward(f,-SPEED*dt));
            if(now>A.until){A.mode='hold';A.until=now+rand(400,1400);A.pad=rand(8,20)}
            break;
          case 'recover':
            if(now>=f.ready-250){
              if(Math.random()<.45){A.mode='back';A.until=now+rand(300,650)}
              else{A.mode='approach';A.willHold=Math.random()<AI_HOLD}
              A.pad=rand(8,20);
            }
            break;
        }
      }

      function impact(lane,att,def,now){
        if(!att||att.state!=='fight'||!att.swing||att.hitDone||now-att.swing<IMPACT_MS)return;
        att.hitDone=true;
        if(!def||def.state!=='fight'){return}
        const isFront=lane.id==='front';
        if(weaponHitsBody(lane,att.side,now)){
          def.hp=Math.max(0,def.hp-2);def.flashUntil=now+220;def.knock=3;def.knockAt=now;def.stun=now+630;
          if(def.swing&&!def.hitDone&&now-def.swing<IMPACT_MS)def.swing=0; // a hit interrupts a swing that hasn't landed
          if(def.hp===0){
            def.state='dying';def.deathAt=now;def.swing=0;
            say(`${isFront?'':'BACK ROW: '}${who(def)} FALLS`,now);
          }else if(isFront)say(att.side==='L'?`HIT! THE ${fighterLabel(def.type)} STAGGERS BACK`:`THE ${fighterLabel(att.type)} HITS — YOU STAGGER`,now);
        }else if(isFront)say(att.side==='L'?'MISS! OUT OF REACH':'THE RIVAL MISSES',now);
      }

      function refill(lane,side,now){
        const army=game.army[side];
        if(!army.length){lane[side]=null;return}
        const o=side==='L'?lane.R:lane.L,type=army.shift();
        const f=makeFighter(side,type,lane.id,0);
        f.state='entry';f.entryAt=now;
        if(side==='L'){f.entryFrom=-60;f.entryTo=alive(o)?Math.max(25,Math.min(56,o.x-spacing(type,o.type)-36)):56}
        else{f.entryFrom=330;f.entryTo=alive(o)?Math.min(198,Math.max(194,o.x+spacing(o.type,type)+36)):194}
        f.x=f.entryFrom;f.ready=now+500;
        lane[side]=f;
        if(lane.id==='front')say(`${who(f)} ENTERS THE BATTLE`,now);
      }

      function updateLane(lane,now,dt){
        for(const side of ['L','R']){
          const f=lane[side];if(!f)continue;
          if(f.state==='entry'){
            // walks on at the same speed as everyone else
            const dist=Math.abs(f.entryTo-f.entryFrom),t=Math.min(1,(now-f.entryAt)/(dist/SPEED*1000));
            f.x=f.entryFrom+(f.entryTo-f.entryFrom)*t;
            if(t>=1){f.state='fight';if(f.ctrl==='player')say('REAL-TIME FIGHT',now)}
          }else if(f.state==='dying'&&now-f.deathAt>=2500){
            lane.corpses.push({type:f.type,cx:centerX(f),flip:f.side==='R'});
            if(lane.corpses.length>10)lane.corpses.shift();
            refill(lane,side,now);
          }
        }
        const L=lane.L,R=lane.R;
        for(const f of [L,R]){
          if(!f||f.state!=='fight')continue;
          if(f.knock&&now>=f.knockAt){moveTo(lane,f,toward(f,-8));f.knock--;f.knockAt=now+105}
          if(f.swing&&now-f.swing>=SWING_MS)f.swing=0;
        }
        if(L&&L.state==='fight'&&L.ctrl==='player'&&!game.done){
          const locked=(L.swing&&now-L.swing<SWING_MS)||now<L.stun||L.knock;
          if(!locked){
            const dir=(held.has('right')?1:0)-(held.has('left')?1:0);
            moveTo(lane,L,L.x+dir*SPEED*dt);
            L.jump=held.has('up')?15:0;
          }
          if(held.has('attack'))startSwing(L,now);
        }else if(L)think(lane,L,R,now,dt);
        if(R)think(lane,R,L,now,dt);
        impact(lane,L,R,now);impact(lane,R,L,now);
      }

      // ---- Drawing ----
      function laneTransform(id){const t=LANES[id];ctx.setTransform(DPR*t.s,0,0,DPR*t.s,DPR*t.ox,DPR*t.oy)}
      function drawLane(lane,now){
        laneTransform(lane.id);
        for(const c of lane.corpses)drawDeath(c.type,c.cx,42+FEET,c.flip,6);
        for(const f of [lane.L,lane.R]){if(!f||f.state==='dying')continue;
          ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(centerX(f),42+FEET-1,f.type==='troll'?30:22,4,0,0,Math.PI*2);ctx.fill()}
        for(const f of [lane.L,lane.R]){
          if(!f)continue;
          if(f.state==='dying'){drawDeath(f.type,centerX(f),42+FEET,f.side==='R',deathFrame(now-f.deathAt));continue}
          const bob=f.state==='entry'?Math.sin((now-f.entryAt)/75)*1.5:0;
          drawFighter(f.type,f.x,f.y,f.side==='R',f.jump+bob,false,swingT(f,now));
          if(now<f.flashUntil){ctx.save();ctx.globalAlpha=.5*(f.flashUntil-now)/220;ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.ellipse(centerX(f),headY(f)+30,18,26,0,0,Math.PI*2);ctx.fill();ctx.restore()}
          // health bar over the head
          const cx=centerX(f),hy=headY(f)-8;
          rect(cx-16,hy,32,4,'#1c1c1c');rect(cx-15,hy+1,30*f.hp/10,2,f.side==='L'?'#e1d54d':'#e57b51');
          if(f.ctrl==='player'){poly([[cx-5,hy-9],[cx+5,hy-9],[cx,hy-3]],'#ffe79b');}
        }
      }
      function drawHud(){
        ctx.setTransform(DPR,0,0,DPR,0,0);
        const y=215;
        const show=(side)=>{
          const a=game.army[side],n=Math.min(5,a.length);
          for(let i=0;i<n;i++){
            const t=a[i],cx=side==='L'?140-i*24:180+i*24;
            if(t==='troll')drawReserveTroll(cx,y,side==='R');else drawReserveSoldier(cx,y,t,side==='R');
            if(i===0)rect(cx-6,238,12,1,'#dec769');
          }
          ctx.fillStyle='#e7dab8';ctx.font='bold 9px monospace';ctx.textAlign=side==='L'?'left':'right';
          ctx.fillText(`×${a.length}`,side==='L'?6:SW-6,231);
        };
        show('L');show('R');
        ctx.save();ctx.translate(159,227);ctx.rotate(-.72);rect(-2,-10,4,20,'#9aa4a4');rect(-5,-6,10,3,'#ddd4ac');rect(-2,7,4,5,'#735230');ctx.restore();
        ctx.save();ctx.translate(161,227);ctx.rotate(.72);rect(-2,-10,4,20,'#a9b4b7');rect(-5,-6,10,3,'#ddd4ac');rect(-2,7,4,5,'#735230');ctx.restore();
        ctx.fillStyle='rgba(16,19,29,.7)';ctx.fillRect(4,118,46,10);ctx.fillRect(4,194,52,10);
        ctx.fillStyle='#e7dab8';ctx.font='bold 7px monospace';ctx.textAlign='left';
        ctx.fillText('BACK · AI',7,125);ctx.fillText('FRONT · YOU',7,201);
        if(game.done){rect(63,96,194,26,'#10131ddd');ctx.fillStyle='#ffe79b';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText(game.winner==='L'?'VICTORY':'DEFEAT',160,113)}
      }
      function draw(now){
        ctx.setTransform(DPR,0,0,DPR,0,0);
        scenery();
        drawLane(game.lanes.back,now);
        drawLane(game.lanes.front,now);
        drawHud();
        const l=remaining('L'),r=remaining('R');
        root.querySelector('#bb-player-hp').style.width=`${l/ARMY_SIZE*100}%`;
        root.querySelector('#bb-enemy-hp').style.width=`${r/ARMY_SIZE*100}%`;
        root.querySelector('#bb-health').textContent=`${l} · ${r}`;
        const status=root.querySelector('#bb-status');if(status.textContent!==game.status)status.textContent=game.status;
        const pl=game.lanes.front.L;atkBtn.classList.toggle('cooling',!!(pl&&pl.ctrl==='player'&&now<pl.ready));
        replay.hidden=!game.done;
      }

      function update(now){
        const dt=Math.min(.04,Math.max(0,(now-game.last)/1000||0));game.last=now;
        if(!game.done){
          updateLane(game.lanes.back,now,dt);
          updateLane(game.lanes.front,now,dt);
          const l=remaining('L'),r=remaining('R');
          const dyingOf=side=>['front','back'].some(id=>{const f=game.lanes[id][side];return f&&f.state==='dying'});
          if((l===0&&!dyingOf('L'))||(r===0&&!dyingOf('R'))){
            game.done=true;game.winner=l>0?'L':'R';held.clear();
            say(game.winner==='L'?'VICTORY — THE RIVAL ARMY IS BROKEN':'DEFEAT — YOUR ARMY IS BROKEN',now);
          }else if(!alive(game.lanes.front.L)&&!(game.lanes.front.L&&game.lanes.front.L.state==='dying')&&l>0&&now-game.statusAt>1500){
            say('YOUR LAST FIGHTERS HOLD THE BACK ROW',now);
          }
        }
        draw(now);requestAnimationFrame(update);
      }

      function press(action,event){if(game.done)return;event.preventDefault();held.add(action);if(action==='attack'){const f=game.lanes.front.L;if(f&&f.ctrl==='player')startSwing(f,performance.now())}try{if(event.pointerId!==undefined&&event.currentTarget.setPointerCapture)event.currentTarget.setPointerCapture(event.pointerId)}catch(e){}}
      function release(action){held.delete(action)}
      root.querySelectorAll('[data-action]').forEach(b=>{const action=b.dataset.action;b.addEventListener('pointerdown',e=>press(action,e));for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>release(action))});
      replay.addEventListener('click',()=>{newGame();game.last=performance.now()});
      const keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',' ':'attack',Enter:'attack'};
      root.addEventListener('keydown',e=>{const action=keyMap[e.key];if(action){e.preventDefault();if(!held.has(action)&&action==='attack'){const f=game.lanes.front.L;if(f&&f.ctrl==='player')startSwing(f,performance.now())}held.add(action)}});
      root.addEventListener('keyup',e=>{const action=keyMap[e.key];if(action)held.delete(action)});
      window.addEventListener('blur',()=>held.clear());
      document.addEventListener('visibilitychange',()=>{if(document.hidden)held.clear()});
      newGame();
      // expose state for automated testing only
      window.__bb={get game(){return game},attackGap,outReach,gapOf};
      requestAnimationFrame(update);
    })();
  </script>
</div>
<script src="../assets/sw-register.js"></script>
</body>
