<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balloon Pop · Play Corner</title>
<meta name="theme-color" content="#F4F8FC">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .screen { height: 100dvh; min-height: 0; }

  .goal {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border-radius: 20px; padding: 10px 14px;
  }
  .goal-text { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; }
  .goal-text svg { flex-shrink: 0; }
  .goal-word { padding: 0 2px; }
  .round { font-size: 14px; font-weight: 800; color: var(--ink-2); white-space: nowrap; }
  .progress { display: flex; gap: 6px; }
  .pip { width: 22px; height: 22px; border-radius: 11px; border: 3px solid #CFDCEA; }
  .pip.on { border-color: transparent; }

  .sky {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    border-radius: 24px; background: #CDEBFB;
  }
  .cloud { position: absolute; fill: #FFFFFF; opacity: .9; pointer-events: none; }
  .hill { position: absolute; left: -10%; right: -10%; bottom: -60px; height: 120px; border-radius: 50%; background: #8FD694; pointer-events: none; }

  .balloon {
    appearance: none; -webkit-appearance: none; border: 0; padding: 0; margin: 0; background: transparent;
    position: absolute; left: 0; top: 0; width: 84px; height: 150px;
    cursor: pointer; will-change: transform; touch-action: manipulation;
  }
  .balloon svg { display: block; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .balloon .bob { transform-origin: 42px 40px; }
  .balloon.nope .bob { animation: nope .4s ease-in-out; }
  @keyframes nope { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

  .burst { position: absolute; width: 0; height: 0; pointer-events: none; }
  .burst i {
    position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 3px;
    animation: fly .6s cubic-bezier(.2,.7,.4,1) forwards;
  }
  .burst b {
    position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%;
    border: 6px solid currentColor; animation: ring .35s ease-out forwards;
  }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
  @keyframes ring { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }

  .cheer {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
    background: var(--ok); color: #FFFFFF; border-radius: 28px; box-shadow: 0 6px 0 #22804F;
    padding: 8px 28px; font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1.2;
    white-space: nowrap; display: none; z-index: 5; pointer-events: none;
  }
  .cheer.show { display: block; animation: cheerpop .4s cubic-bezier(.3,.7,.3,1.4); }
  @keyframes cheerpop { from { transform: translate(-50%, -50%) scale(.6); } to { transform: translate(-50%, -50%) scale(1); } }
</style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <a class="round-btn" href="../" aria-label="Back to games">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1>Balloon Pop</h1>
    <button class="round-btn" type="button" id="restart" aria-label="Start over">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>

  <div class="goal">
    <div class="goal-text" id="goalText" aria-live="polite"></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div class="round" id="round">Round 1</div>
      <div class="progress" id="progress" role="img"></div>
    </div>
  </div>

  <div class="sky" id="sky">
    <svg class="cloud" style="left:6%;top:10%" width="110" height="50" viewBox="0 0 110 50" aria-hidden="true"><ellipse cx="30" cy="32" rx="26" ry="16"/><ellipse cx="58" cy="22" rx="28" ry="20"/><ellipse cx="84" cy="34" rx="22" ry="14"/></svg>
    <svg class="cloud" style="right:4%;top:32%" width="90" height="40" viewBox="0 0 110 50" aria-hidden="true"><ellipse cx="30" cy="32" rx="26" ry="16"/><ellipse cx="58" cy="22" rx="28" ry="20"/><ellipse cx="84" cy="34" rx="22" ry="14"/></svg>
    <svg class="cloud" style="left:28%;top:62%" width="80" height="36" viewBox="0 0 110 50" aria-hidden="true"><ellipse cx="30" cy="32" rx="26" ry="16"/><ellipse cx="58" cy="22" rx="28" ry="20"/><ellipse cx="84" cy="34" rx="22" ry="14"/></svg>
    <div class="hill"></div>
    <div class="cheer" id="cheer">Great popping!</div>
  </div>

  <p class="hint" id="hint">Tap the balloons to pop them!</p>
</main>

<script>
(function () {
  // ---- Tuning ----
  var PER_ROUND = 5;          // balloons to pop each round
  var BASE_SPEED = 70;        // px per second the balloons rise in round 1
  var SPEED_UP = 1.1;         // each round is 10% faster
  var SPAWN_MS = 950;         // a new balloon about every second
  var MAX_ON_SCREEN = 7;

  var COLORS = [
    { name: 'red',    fill: '#E5484D', dark: '#B8323A' },
    { name: 'blue',   fill: '#2F6FED', dark: '#1F4FB8' },
    { name: 'yellow', fill: '#F5B800', dark: '#C48F00' },
    { name: 'green',  fill: '#2FA86B', dark: '#22804F' },
    { name: 'purple', fill: '#8B5CF6', dark: '#6A3FD0' }
  ];

  var sky = document.getElementById('sky');
  var goalText = document.getElementById('goalText');
  var roundEl = document.getElementById('round');
  var progress = document.getElementById('progress');
  var cheer = document.getElementById('cheer');

  var balloons = [], round, target, popped, lastSpawn, sinceTarget, pausedUntil = 0, lastTarget = -1;

  function balloonSvg(c) {
    return '<svg viewBox="0 0 84 150" aria-hidden="true"><g class="bob">' +
      '<path d="M42 92 C38 104 48 112 42 124 C36 136 46 142 42 150" fill="none" stroke="#7A8AA6" stroke-width="2"/>' +
      '<path d="M42 86 L35 95 H49 Z" fill="' + c.dark + '"/>' +
      '<ellipse cx="42" cy="46" rx="38" ry="44" fill="' + c.fill + '"/>' +
      '<ellipse cx="28" cy="28" rx="8" ry="13" fill="#FFFFFF" opacity=".45" transform="rotate(-25 28 28)"/>' +
      '</g></svg>';
  }

  function miniBalloon(c, size) {
    return '<svg width="' + size + '" height="' + (size * 1.25) + '" viewBox="0 0 84 105" aria-hidden="true">' +
      '<path d="M42 86 L35 95 H49 Z" fill="' + c.dark + '"/>' +
      '<ellipse cx="42" cy="46" rx="38" ry="44" fill="' + c.fill + '"/>' +
      '<ellipse cx="28" cy="28" rx="8" ry="13" fill="#FFFFFF" opacity=".45" transform="rotate(-25 28 28)"/></svg>';
  }

  function renderGoal() {
    var c = COLORS[target];
    goalText.innerHTML = miniBalloon(c, 28) +
      '<span>Pop ' + PER_ROUND + ' <span class="goal-word" style="color:' + c.dark + '">' + c.name + '</span> balloons!</span>';
    roundEl.textContent = 'Round ' + round;
    var html = '';
    for (var i = 0; i < PER_ROUND; i++) {
      html += '<div class="pip' + (i < popped ? ' on' : '') + '"' + (i < popped ? ' style="background:' + c.fill + '"' : '') + '></div>';
    }
    progress.innerHTML = html;
    progress.setAttribute('aria-label', popped + ' of ' + PER_ROUND + ' ' + c.name + ' balloons popped');
  }

  function newRound() {
    var t;
    do { t = Math.floor(Math.random() * COLORS.length); } while (t === lastTarget);
    lastTarget = target = t;
    popped = 0;
    sinceTarget = 0;
    renderGoal();
  }

  function startOver() {
    balloons.forEach(function (b) { b.el.remove(); });
    balloons = [];
    round = 1;
    lastTarget = -1;
    cheer.classList.remove('show');
    pausedUntil = 0;
    lastSpawn = 0;
    newRound();
  }

  function spawn(now) {
    var w = sky.clientWidth, h = sky.clientHeight;
    // make sure the colour we're looking for turns up often
    var ci;
    if (sinceTarget >= 2 || Math.random() < 0.4) ci = target;
    else { do { ci = Math.floor(Math.random() * COLORS.length); } while (ci === target); }
    sinceTarget = ci === target ? 0 : sinceTarget + 1;

    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'balloon';
    el.setAttribute('aria-label', COLORS[ci].name + ' balloon');
    el.innerHTML = balloonSvg(COLORS[ci]);
    sky.appendChild(el);

    // pick a lane that isn't right on top of the newest balloon
    var x, tries = 0, last = balloons[balloons.length - 1];
    do { x = 6 + Math.random() * Math.max(10, w - 96); tries++; }
    while (last && Math.abs(x - last.x) < 70 && tries < 6);

    var b = {
      el: el, color: ci, x: x, y: h + 10,
      speed: BASE_SPEED * Math.pow(SPEED_UP, round - 1) * (0.85 + Math.random() * 0.3),
      sway: 8 + Math.random() * 10, phase: Math.random() * 6.28, born: now, popped: false
    };
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(b); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(b); } });
    balloons.push(b);
  }

  // ---- little pop sound (made on the fly, no files) ----
  var actx;
  function popSound(good) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime, len = 0.12;
      var buf = actx.createBuffer(1, Math.floor(actx.sampleRate * len), actx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      var src = actx.createBufferSource(); src.buffer = buf;
      var g = actx.createGain(); g.gain.value = 0.6;
      src.connect(g).connect(actx.destination); src.start(t);
      if (good) {
        var o = actx.createOscillator(), og = actx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(660, t + 0.05); o.frequency.exponentialRampToValueAtTime(1320, t + 0.2);
        og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.25, t + 0.06); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        o.connect(og).connect(actx.destination); o.start(t); o.stop(t + 0.3);
      }
    } catch (err) {}
  }

  function burst(b) {
    var c = COLORS[b.color];
    var el = document.createElement('div');
    el.className = 'burst';
    el.style.left = (b.x + 42) + 'px';
    el.style.top = (b.y + 46) + 'px';
    el.style.color = c.fill;
    var html = '<b></b>';
    var bits = ['#E5484D', '#F5B800', '#2F6FED', '#2FA86B', '#8B5CF6', c.fill, c.fill];
    for (var i = 0; i < 12; i++) {
      var a = i / 12 * Math.PI * 2, r = 50 + Math.random() * 40;
      html += '<i style="background:' + bits[i % bits.length] + ';--dx:' + Math.round(Math.cos(a) * r) + 'px;--dy:' + Math.round(Math.sin(a) * r) + 'px;--r:' + Math.round(Math.random() * 360) + 'deg"></i>';
    }
    el.innerHTML = html;
    sky.appendChild(el);
    setTimeout(function () { el.remove(); }, 700);
  }

  function tap(b) {
    if (b.popped) return;
    var now = performance.now();
    if (now < pausedUntil) return;
    if (b.color === target) {
      b.popped = true;
      b.el.remove();
      burst(b);
      popSound(true);
      if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
      popped++;
      renderGoal();
      if (popped >= PER_ROUND) roundDone(now);
    } else {
      // not the one we want: a little wiggle, no penalty
      b.el.classList.remove('nope');
      void b.el.offsetWidth;
      b.el.classList.add('nope');
    }
  }

  function roundDone(now) {
    pausedUntil = now + 1800;
    cheer.textContent = ['Great popping!', 'Super!', 'Well done!', 'Amazing!'][(round - 1) % 4];
    cheer.classList.add('show');
    // float the rest away quickly
    balloons.forEach(function (b) { b.speed *= 4; });
    setTimeout(function () {
      cheer.classList.remove('show');
      round++;
      newRound();
    }, 1800);
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (now >= pausedUntil && now - lastSpawn > SPAWN_MS && balloons.length < MAX_ON_SCREEN) {
      lastSpawn = now;
      spawn(now);
    }
    for (var i = balloons.length - 1; i >= 0; i--) {
      var b = balloons[i];
      if (b.popped) { balloons.splice(i, 1); continue; }
      b.y -= b.speed * dt;
      var sx = Math.sin((now - b.born) / 700 + b.phase) * b.sway;
      b.el.style.transform = 'translate(' + (b.x + sx) + 'px,' + b.y + 'px)';
      if (b.y < -170) { b.el.remove(); balloons.splice(i, 1); }
    }
    requestAnimationFrame(frame);
  }

  document.getElementById('restart').addEventListener('click', startOver);
  startOver();
  requestAnimationFrame(frame);
})();
</script>
<script src="../assets/sw-register.js"></script>
</body>
</html>
