<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找一找 Find It · Play Corner</title>
<meta name="theme-color" content="#F4F8FC">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .screen { height: 100dvh; min-height: 0; }
  .ask { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 20px; padding: 10px 12px; }
  .ask-main { flex: 1; min-width: 0; }
  .ask-hz { font-size: 30px; font-weight: 900; line-height: 1.15; white-space: nowrap; }
  .ask-py { font-size: 15px; }
  .stars { display: flex; gap: 3px; margin-top: 4px; }
  .stars svg { width: 18px; height: 18px; opacity: .2; }
  .stars svg.on { opacity: 1; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .pick {
    appearance: none; border: 0; cursor: pointer; padding: 10px; min-height: 0;
    background: var(--card); border-radius: 24px; box-shadow: 0 6px 0 var(--card-shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative;
  }
  .pick .pic { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .pick .pic svg { width: auto; height: 100%; max-width: 100%; max-height: 150px; }
  .pick .lab { visibility: hidden; text-align: center; line-height: 1.1; }
  .pick .lab .zh { font-size: 26px; font-weight: 900; color: var(--ink); }
  .pick .lab .py { font-size: 14px; display: block; }
  .pick.show .lab { visibility: visible; }
  .pick.right { box-shadow: 0 0 0 5px var(--ok), 0 6px 0 var(--card-shadow); animation: yes .5s ease-out; }
  .pick.wrong { animation: no .45s ease-in-out; }
  @keyframes yes { 50% { transform: scale(1.06); } }
  @keyframes no { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .cheer {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 20;
    background: var(--ok); color: #fff; border-radius: 28px; box-shadow: 0 6px 0 #22804F;
    padding: 8px 28px; font-size: 40px; font-weight: 900; white-space: nowrap; display: none; pointer-events: none; text-align: center;
  }
  .cheer small { display: block; font-family: var(--body); font-size: 16px; font-weight: 800; opacity: .9; }
  .cheer.show { display: block; animation: cheerpop .4s cubic-bezier(.3,.7,.3,1.4); }
  @keyframes cheerpop { from { transform: translate(-50%, -50%) scale(.6); } to { transform: translate(-50%, -50%) scale(1); } }
</style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <a class="round-btn" href="../" aria-label="Back to games">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1><span class="zh">找一找</span> <span style="font-size:18px">Find It</span></h1>
    <button class="round-btn" type="button" id="restart" aria-label="Start over">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>

  <div class="chips" id="chips" role="tablist" aria-label="Topic"></div>

  <div class="ask">
    <button class="speak-btn" type="button" id="speak" aria-label="Hear it again">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#1D2B4F"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <div class="ask-main" aria-live="polite">
      <div class="ask-hz zh" id="askHz"></div>
      <div class="ask-py py" id="askPy"></div>
      <div class="stars" id="stars" role="img"></div>
    </div>
  </div>

  <p class="voice-note" id="voiceNote"></p>

  <div class="grid" id="grid"></div>
</main>

<div class="cheer zh" id="cheer"></div>

<div class="start" id="start">
  <div style="font-size:64px;font-weight:900" class="zh">找一找</div>
  <p class="hint" style="font-size:18px">Listen, then tap the right picture.</p>
  <button class="big-btn" type="button" id="go"><span class="zh">开始</span> · Start</button>
</div>

<script src="../assets/animals.js"></script>
<script src="../assets/sfx.js"></script>
<script src="../assets/zh.js"></script>
<script>
(function () {
  var PER_ROUND = 8, CATS = ['animals', 'fruits', 'colours', 'body'];
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), chips = $('chips'), stars = $('stars'), cheer = $('cheer');
  var cat = 'animals', target, choices, done, busy = false, last;

  CATS.forEach(function (c) {
    var v = PC.zhVocab[c];
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.cat = c; b.setAttribute('role', 'tab');
    b.innerHTML = '<span class="zh">' + v.hz + '</span><span class="py">' + v.py + '</span>';
    b.addEventListener('click', function () { cat = c; startRound(); PC.zh.say(v.hz); });
    chips.appendChild(b);
  });

  function ask() { PC.zh.say(target.hz + '在哪里?'); }

  function renderStars() {
    var h = '';
    for (var i = 0; i < PER_ROUND; i++) h += '<svg viewBox="0 0 100 100" class="' + (i < done ? 'on' : '') + '"><polygon points="50,6 62,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 38,37" fill="#F5B800"/></svg>';
    stars.innerHTML = h;
    stars.setAttribute('aria-label', done + ' of ' + PER_ROUND);
  }

  function startRound() {
    done = 0;
    [].forEach.call(chips.children, function (b) { b.classList.toggle('on', b.dataset.cat === cat); b.setAttribute('aria-selected', b.dataset.cat === cat); });
    renderStars();
    next();
  }

  function next() {
    busy = false;
    var items = PC.zhVocab[cat].items.slice();
    do { target = items[Math.floor(Math.random() * items.length)]; } while (target === last && items.length > 1);
    last = target;
    var others = items.filter(function (i) { return i !== target; }).sort(function () { return Math.random() - .5; }).slice(0, 3);
    choices = others.concat([target]).sort(function () { return Math.random() - .5; });
    $('askHz').textContent = target.hz + '在哪里?';
    $('askPy').textContent = target.py + ' zài nǎ lǐ?';
    grid.innerHTML = '';
    choices.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pick';
      b.setAttribute('aria-label', it.en);
      b.innerHTML = '<div class="pic">' + it.pic() + '</div><div class="lab"><span class="zh">' + it.hz + '</span><span class="py">' + it.py + '</span></div>';
      b.addEventListener('click', function () { choose(it, b); });
      grid.appendChild(b);
    });
    ask();
  }

  function choose(it, b) {
    if (busy) return;
    PC.sfx.unlock();
    b.classList.add('show');
    if (it === target) {
      busy = true;
      b.classList.add('right');
      PC.sfx.yum();
      PC.zh.say('对了! ' + it.hz + '!');
      done++;
      renderStars();
      if (done >= PER_ROUND) return setTimeout(roundDone, 1300);
      setTimeout(next, 1700);
    } else {
      b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      PC.sfx.boing();
      PC.zh.say('这是' + it.hz + '。' + target.hz + '在哪里?');
    }
  }

  function roundDone() {
    cheer.innerHTML = '真棒!<small>zhēn bàng! · Well done!</small>';
    cheer.classList.add('show');
    PC.sfx.tada();
    PC.zh.say('真棒!');
    setTimeout(function () {
      cheer.classList.remove('show');
      cat = CATS[(CATS.indexOf(cat) + 1) % CATS.length];   // move on to the next topic
      startRound();
    }, 2400);
  }

  $('speak').addEventListener('click', function () { PC.sfx.unlock(); ask(); });
  $('restart').addEventListener('click', startRound);
  $('go').addEventListener('click', function () { PC.sfx.unlock(); $('start').hidden = true; startRound(); });
  PC.zh.voiceNotice($('voiceNote'));
})();
</script>
<script src="../assets/sw-register.js"></script>
</body>
</html>
